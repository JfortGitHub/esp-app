<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нормативы ЭСП — Full v4.7 (серверная версия)</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="window.__XLSX_FAILED=true"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" onerror="window.__JSPDF_FAILED=true"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js" onerror="window.__AUTOTABLE_FAILED=true"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" onerror="window.__DOCX_FAILED=true"></script>

<style>
:root{--bg:#111827;--panel:#1f2937;--border:#374151;--border-hi:#4b5563;--text:#e5e7eb;--muted:#9ca3af;--dim:#6b7280;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--yellow:#eab308;--purple:#a855f7;--cyan:#06b6d4;--orange:#ea580c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;background:#111827;color:var(--text)}
.login-screen{position:fixed;inset:0;z-index:2000;background:radial-gradient(ellipse at 30% 20%,rgba(234,88,12,.2),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(217,119,6,.15),transparent 55%),#111827;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.login-box{background:#1f2937;border:1px solid var(--border-hi);border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,#ea580c,#b45309);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 32px rgba(234,88,12,.45)}
.login-box h2{text-align:center;color:#fff;font-size:22px;font-weight:800;margin-bottom:6px}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;letter-spacing:.5px;text-transform:uppercase}
.login-box .sub b{color:#fdba74}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.login-field input{width:100%;background:#111827;border:1px solid #4b5563;border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;font-family:inherit}
.login-field input:focus{outline:none;border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.15)}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#ea580c,#b45309);color:#fff;font-size:14px;font-weight:700;font-family:inherit;margin-top:8px;transition:all .2s}
.login-btn:hover{background:linear-gradient(135deg,#c2410c,#92400e);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:wait}
.login-error{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:none}
.login-error.show{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-hint{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);text-align:center;line-height:1.7}
.login-accounts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.login-account{background:#111827;border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;transition:all .15s}
.login-account:hover{border-color:#fb923c;background:#1a2233}
.login-account .role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.login-account .login-name{font-family:monospace;font-size:11.5px;color:#fdba74;margin-top:2px}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh;overflow:hidden}
.app.hidden{display:none}
.sidebar{background:#1f2937;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#7c2d12,#9a3412,#b45309)}
.brand-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#ea580c,#b45309);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.brand-text h1{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.brand-text p{font-size:11px;color:#fdba74;margin-top:2px}
.nav-scroll{flex:1;overflow-y:auto;padding:12px 10px}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:#4b5563;border-radius:3px}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;padding:6px 10px;font-weight:600}
.nav-section-title.full{color:#fb923c}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#cbd5e1;font-size:13.5px;font-weight:500;transition:all .18s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:#334155;color:#fff}
.nav-item.active{background:linear-gradient(135deg,#ea580c,#b45309);color:#fff}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge-n{margin-left:auto;background:rgba(234,88,12,.25);color:#fdba74;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.nav-item.active .badge-n{background:rgba(255,255,255,.2);color:#fff}
.nav-item.admin-only{opacity:.5;pointer-events:none}
.nav-item.full-only .ico{color:#fdba74}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dim);text-align:center}
.sidebar-footer .ver{color:#fdba74;font-weight:700}
.main{display:flex;flex-direction:column;overflow:hidden;position:relative;background:#111827}
.topbar{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#1f2937;z-index:10;flex-wrap:wrap;gap:10px}
.topbar-title{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:15px;flex:1;min-width:200px}
.topbar-title .dot{width:8px;height:8px;border-radius:50%;background:#fb923c;box-shadow:0 0 10px #fb923c;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-badge{display:flex;align-items:center;gap:8px;background:#111827;border:1px solid var(--border);border-radius:10px;padding:6px 12px 6px 8px;font-size:12px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ea580c,#b45309);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.user-badge .uname{color:#fff;font-weight:600}
.user-badge .urole{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;background:#374151;color:#cbd5e1;font-family:inherit;white-space:nowrap}
.btn:hover{background:#4b5563;color:#fff}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:hover{background:#374151;color:#fff}
.btn-danger{background:rgba(220,38,38,.15);color:#fca5a5;border-color:rgba(220,38,38,.35)}
.btn-orange{background:linear-gradient(135deg,#ea580c,#b45309);color:#fff}
.btn-xs{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-ico{padding:8px;width:36px;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chat{flex:1;overflow-y:auto;padding:24px 24px 40px;display:flex;flex-direction:column;gap:14px}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.msg{max-width:100%;display:flex;animation:slideIn .35s}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bubble{background:#1f2937;border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.6;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.25);width:100%;max-width:1000px}
.bubble-title{color:#fff;font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bubble-sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.bubble ul{list-style:none;margin:6px 0}
.bubble li{padding:3px 0;font-size:13.5px;display:flex;gap:8px}
.bubble li::before{content:'▸';color:#fb923c;flex-shrink:0}
.bubble code{font-family:'JetBrains Mono',monospace;background:#111827;padding:2px 6px;border-radius:4px;font-size:12.5px;color:#fdba74}
.bubble .hl{color:#fdba74;font-weight:600}
.tm-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(168,85,247,.15);color:#d8b4fe;padding:3px 8px;border-radius:6px;border:1px solid rgba(168,85,247,.3);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:600;border:1px solid}
.chip-blue{color:#93c5fd;border-color:rgba(59,130,246,.4);background:rgba(37,99,235,.15)}
.chip-green{color:#86efac;border-color:rgba(34,197,94,.4);background:rgba(22,163,74,.15)}
.chip-yellow{color:#fde047;border-color:rgba(234,179,8,.4);background:rgba(202,138,4,.15)}
.chip-red{color:#fca5a5;border-color:rgba(239,68,68,.4);background:rgba(220,38,38,.15)}
.chip-purple{color:#d8b4fe;border-color:rgba(168,85,247,.4);background:rgba(147,51,234,.15)}
.chip-orange{color:#fdba74;border-color:rgba(249,115,22,.4);background:rgba(234,88,12,.15)}
.chip-cyan{color:#67e8f9;border-color:rgba(6,182,212,.4);background:rgba(8,145,178,.15)}
.chip-gray{color:#cbd5e1;border-color:rgba(100,116,139,.4);background:rgba(51,65,85,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.tile{background:#111827;border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:all .2s}
.tile:hover{border-color:var(--border-hi)}
.tile.clickable{cursor:pointer}
.tile-h{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.tile-v{font-size:22px;font-weight:800;color:#fff}
.tile-v.blue{color:#60a5fa}.tile-v.green{color:#4ade80}.tile-v.purple{color:#c084fc}
.tile-v.yellow{color:#facc15}.tile-v.red{color:#f87171}.tile-v.orange{color:#fb923c}
.tile-d{font-size:11.5px;color:var(--muted);margin-top:4px}
.norms-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#111827;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.search-inp{flex:1;min-width:200px;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:9px 14px;color:#fff;font-size:13.5px;font-family:inherit}
.search-inp:focus{outline:none;border-color:#fb923c}
.sel{background:#111827;border:1px solid #4b5563;border-radius:8px;padding:8px 12px;color:#cbd5e1;font-size:12.5px;font-family:inherit;cursor:pointer}
.norm-row{background:#111827;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:all .2s}
.norm-row:hover{border-color:var(--border-hi);background:#1a2233}
.norm-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.norm-row-info{flex:1;min-width:200px}
.norm-row-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#fdba74;font-weight:600}
.norm-row-name{color:#fff;font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.35}
.norm-row-eq{color:var(--muted);font-size:11.5px;margin-top:3px}
.norm-row-tm{margin-top:5px}
.norm-row-stats{display:flex;gap:16px;align-items:center;flex-shrink:0}
.norm-stat{text-align:center}
.norm-stat-v{font-size:18px;font-weight:800;color:#fff;line-height:1}
.norm-stat-l{font-size:10px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.norm-row-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.calc-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.calc-wrap{grid-template-columns:1fr}}
.calc-list{background:#111827;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.calc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(55,65,81,.6);font-size:13px}
.calc-item:last-child{border-bottom:none}
.calc-item-name{flex:1;min-width:0;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-item-meta{font-size:11px;color:var(--dim)}
.qty-btn{width:24px;height:24px;border-radius:6px;background:#374151;color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:#ea580c}
.qty-val{color:#fff;font-weight:700;width:28px;text-align:center;font-size:13.5px}
.calc-del{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;font-size:14px}
.calc-del:hover{color:#f87171}
.calc-summary{background:#111827;padding:14px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.calc-sidebar{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;position:sticky;top:10px;height:fit-content}
.stat-bar{margin-bottom:10px}
.stat-bar-h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.stat-bar-name{color:var(--muted)}
.stat-bar-v{color:#fff;font-weight:700}
.stat-bar-track{height:8px;background:#374151;border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.tech-card{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.tech-card-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.tech-card-num{font-family:'JetBrains Mono',monospace;color:#fdba74;font-size:12.5px;font-weight:700}
.tech-card-title{color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.tech-card-meta{color:var(--muted);font-size:12px;margin-top:4px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s}
.modal{background:#1f2937;border:1px solid var(--border-hi);border-radius:16px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1f2937;z-index:5}
.modal-title{color:#fff;font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px}
.modal-close:hover{color:#fff}
.modal-body{padding:20px 22px}
.form-group{margin-bottom:14px}
.form-lbl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-inp,.form-sel,.form-ta{width:100%;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:9px 12px;color:#fff;font-size:13.5px;font-family:inherit}
.form-inp:focus,.form-sel:focus,.form-ta:focus{outline:none;border-color:#fb923c}
.form-inp.err{border-color:#dc2626}
.form-inp.ok{border-color:#16a34a}
.form-inp.tm{font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.form-ta{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-sec-title{color:#fff;font-weight:700;font-size:13px;margin:18px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.form-hint{font-size:11px;color:var(--dim);margin-top:4px}
.form-hint.err{color:#fca5a5}
.form-hint.ok{color:#86efac}
.warn-banner{background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.4);color:#fde047;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.warn-banner.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}
.warn-banner.err{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.4);color:#fca5a5}
.warn-banner.info{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.4);color:#93c5fd}
.empty{text-align:center;padding:40px 20px;color:var(--dim);background:#111827;border:1px dashed #4b5563;border-radius:12px}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.6}
.badge-mini{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700;background:#374151;color:var(--muted)}
.badge-version{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(234,88,12,.25);color:#fdba74;border:1px solid rgba(234,88,12,.5)}
.badge-role{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.badge-role.admin{background:rgba(220,38,38,.2);color:#fca5a5;border:1px solid rgba(220,38,38,.4)}
.badge-role.engineer{background:rgba(37,99,235,.2);color:#93c5fd;border:1px solid rgba(37,99,235,.4)}
.badge-role.user{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4)}
.module-card{background:#111827;border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.module-card:hover{border-color:#fb923c}
.module-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ea580c,#b45309)}
.module-card.ready::before{background:linear-gradient(90deg,#16a34a,#22c55e)}
.module-card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.module-card-icon{font-size:28px;flex-shrink:0}
.module-card-title{color:#fff;font-weight:700;font-size:15px;margin-bottom:3px}
.module-card-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;display:inline-block}
.module-card-status.ready{background:rgba(34,197,94,.2);color:#86efac}
.module-card-desc{color:var(--muted);font-size:12.5px;line-height:1.5}
.mob-toggle{display:none}
@media(max-width:900px){
  .app{grid-template-columns:0 1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:200;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .mob-toggle{display:inline-flex}
  .chat{padding:16px}
}
.full-toast{position:fixed;bottom:24px;right:24px;z-index:5000;background:linear-gradient(135deg,#ea580c,#b45309);color:#fff;padding:14px 20px;border-radius:12px;box-shadow:0 12px 32px rgba(234,88,12,.5);font-size:13px;max-width:340px;display:flex;gap:12px;align-items:flex-start}
.full-toast .toast-icon{font-size:22px;flex-shrink:0}
.full-toast .toast-title{font-weight:700;margin-bottom:4px}
.full-toast .toast-desc{opacity:.9;font-size:12px;line-height:1.4}
.full-toast .toast-close{position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">

      Демо-доступы (нажмите для подстановки):
      <div class="login-accounts">
        <div class="login-account" data-login="admin" data-pwd="admin123"><div class="role">Админ</div><div class="login-name">admin</div></div>
        <div class="login-account" data-login="engineer" data-pwd="eng123"><div class="role">Инженер</div><div class="login-name">engineer</div></div>
        <div class="login-account" data-login="user" data-pwd="user123"><div class="role">Польз.</div><div class="login-name">user</div></div>
      </div>
    </div>
  </form>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">🔬</div><div class="brand-text"><h1>Нормативы ЭСП</h1><p>Full v4.7 · Серверный</p></div></div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="sidebar-footer">ЭСП © 2024–2026 · v4.7 <span class="ver">Full</span></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="dot"></span>
        <span id="topbarTitle">Обзор Full</span>
        <span class="badge-version" id="versionBadge">Full v4.7</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ico mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <button class="btn btn-ghost" onclick="switchToLite()" title="Переключиться в Lite-версию">↩ Lite</button>
        <div class="user-badge" id="userBadge"></div>
        <button class="btn btn-ghost" onclick="doLogout()">⎋ Выход</button>
      </div>
    </div>
    <div class="chat" id="chat"></div>
  </main>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   СЛОВАРИ
   ═══════════════════════════════════════════════════════════ */
const SECTION_NAMES = {'UPSMiF':'УПСМиФ','DSP':'ДСП','UPK':'УПК (печь-ковш)','UVD':'УВД (вакууматор)','ONLZ':'ОНЛЗ','USH':'УСХиОЗ','UOR':'УОРСиШК','BLD':'Здания производственные','ABK':'АБК','LIFT':'Подъёмные сооружения'};
const CATEGORY_NAMES = {mechanical:'Механическое',energy:'Энергетическое',hydraulic:'Гидравлическое',electric:'Электрическое',lifting:'Подъёмные сооружения',refractory:'Огнеупорное',building:'Строительные конструкции'};
const SOURCE_NAMES = {federal:'Федеральные нормативы',gost:'ГОСТы',safety:'Правила безопасности (ФНП)',actual:'Фактические данные',industry:'Отраслевые рекомендации'};
const REPAIR_NAMES = {'ТР':'Текущий ремонт','СР':'Средний ремонт','КР':'Капитальный ремонт'};
const ROLE_NAMES = {admin:'Администратор',engineer:'Инженер',user:'Пользователь'};

/* ═══════════════════════════════════════════════════════════
   API-КЛИЕНТ
   ═══════════════════════════════════════════════════════════ */
const API = {
  token: localStorage.getItem('esp_token') || '',
  user: null,
  async call(method, path, body){
    const headers = { 'Content-Type': 'application/json' };
    if(this.token) headers['Authorization'] = 'Bearer ' + this.token;
    let r;
    try { r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
    catch(e) { return { ok:false, msg:'Сервер недоступен' }; }
    if(r.status === 401){
      this.token = '';
      localStorage.removeItem('esp_token');
      showLogin();
      return { ok:false, msg:'Сессия истекла' };
    }
    try { return await r.json(); } catch(e) { return { ok:false, msg:'Ошибка ответа' }; }
  },
  get(p){ return this.call('GET', p); },
  post(p, b){ return this.call('POST', p, b); },
  put(p, b){ return this.call('PUT', p, b); },
  del(p){ return this.call('DELETE', p); },
  async login(login, password){
    const r = await this.post('/api/login', { login, password });
    if(r.ok){ this.token = r.token; this.user = r.user; localStorage.setItem('esp_token', r.token); }
    return r;
  },
  async me(){ const r = await this.get('/api/me'); if(r.ok) this.user = r.user; return r; },
  logout(){ this.token = ''; this.user = null; localStorage.removeItem('esp_token'); }
};

/* ═══════════════════════════════════════════════════════════
   СОСТОЯНИЕ
   ═══════════════════════════════════════════════════════════ */
const state = {
  tab:'overview-full', norms:[], equipment:[], cards:[], workflowStates:{}, versions:{},
  search:'', fSection:'', fCat:'', fRep:'', fSrc:'',
  calc:[], calcSearch:'',
  workflowFilter:'all',
  importParsed:null, importIsEquip:false, importFilename:''
};

function allNorms(){ return state.norms; }
function getFiltered(){
  return state.norms.filter(n => {
    const s = state.search.toLowerCase().trim();
    const mS = !s || (n.operationName||'').toLowerCase().includes(s) || (n.equipmentType||'').toLowerCase().includes(s)
      || (n.operationCode||'').toLowerCase().includes(s) || (n.tm && n.tm.toLowerCase().includes(s));
    return mS
      && (!state.fSection || n.section === state.fSection)
      && (!state.fCat || n.equipmentCategory === state.fCat)
      && (!state.fRep || n.repairType === state.fRep)
      && (!state.fSrc || n.sourceType === state.fSrc);
  });
}

/* ═══════════════════════════════════════════════════════════
   ЗАГРУЗКА ДАННЫХ
   ═══════════════════════════════════════════════════════════ */
async function loadAll(){
  const [n, e, c, ws] = await Promise.all([
    API.get('/api/norms'),
    API.get('/api/equipment'),
    API.get('/api/cards'),
    API.get('/api/workflow/states')
  ]);
  if(n.ok) state.norms = n.norms || [];
  if(e.ok) state.equipment = e.equipment || [];
  if(c.ok) state.cards = c.cards || [];
  if(ws.ok) state.workflowStates = ws.states || {};
}
async function refreshNorms(){ const r = await API.get('/api/norms'); if(r.ok) state.norms = r.norms || []; }
async function refreshVersions(normId){
  const r = await API.get('/api/versions/' + normId);
  if(r.ok){ state.versions[normId] = r.versions || []; return state.versions[normId]; }
  return [];
}
function getVersions(normId){ return state.versions[normId] || []; }

/* ═══════════════════════════════════════════════════════════
   TM + ХЕЛПЕРЫ
   ═══════════════════════════════════════════════════════════ */
const TM_PREFIX = '1201';
function validateTM(tm){
  if(!tm) return {ok:true, empty:true, msg:'Необязательно'};
  const p = tm.split('-');
  if(p.length !== 7) return {ok:false, msg:'Ожидается 7 групп'};
  if(p[0] !== TM_PREFIX) return {ok:false, msg:`Префикс ${TM_PREFIX}`};
  for(let i=1;i<7;i++){ if(!/^\d{3}$/.test(p[i])) return {ok:false, msg:`Группа ${i}: 3 цифры`}; }
  return {ok:true, msg:'OK'};
}
function autoFormatTM(input){
  let v = input.value.replace(/[^\d]/g,'');
  if(v.length > 22) v = v.slice(0,22);
  if(!v){ input.value=''; return; }
  if(v.length <= 4){ input.value = v; return; }
  let out = v.slice(0,4);
  for(let i=4; i<v.length; i+=3) out += '-' + v.slice(i, i+3);
  input.value = out;
}
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(text, type='info', duration=3000){
  const t = document.createElement('div');
  t.className = 'full-toast';
  const icons = {ok:'✅', info:'ℹ️', warn:'⚠️', err:'❌'};
  t.innerHTML = `<button class="toast-close" onclick="this.parentElement.remove()">×</button>
    <div class="toast-icon">${icons[type]||'ℹ️'}</div>
    <div><div class="toast-title">${type==='ok'?'Готово':type==='err'?'Ошибка':'Информация'}</div>
    <div class="toast-desc">${escapeHtml(text)}</div></div>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), duration);
}

/* ═══════════════════════════════════════════════════════════
   LOGIN / LOGOUT
   ═══════════════════════════════════════════════════════════ */
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.add('hidden');
  const f = document.getElementById('loginForm'); if(f) f.reset();
  const e = document.getElementById('loginError'); if(e) e.classList.remove('show');
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  renderUserBadge(); renderNav(); renderChat();
}
function renderUserBadge(){
  const s = API.user; if(!s) return;
  const initial = (s.name||s.login).charAt(0).toUpperCase();
  document.getElementById('userBadge').innerHTML = `
    <div class="user-avatar">${initial}</div>
    <div>
      <div class="uname">${escapeHtml(s.name||s.login)}</div>
      <div class="urole">${ROLE_NAMES[s.role]||s.role}</div>
    </div>`;
}
async function doLogout(){ if(!confirm('Выйти из системы?')) return; API.logout(); showLogin(); }
async function switchToLite(){
  if(!confirm('↩ Переход в Lite-версию?\n\nВсе данные общие — вы увидите то же самое.')) return;
  window.location.href = 'esp-lite.html';
}

/* ═══════════════════════════════════════════════════════════
   НАВИГАЦИЯ
   ═══════════════════════════════════════════════════════════ */
function buildNav(){
  const role = API.user?.role || 'user';
  return [
    {group:'Базовая работа',items:[
      {id:'normatives',label:'Нормативы',ico:'🔍',badge:state.norms.length+''},
      {id:'calculator',label:'Калькулятор',ico:'🧮'},
      {id:'cards',label:'Тех. карты',ico:'📄',badge:state.cards.length+''},
      {id:'statistics',label:'Статистика',ico:'📊'},
      {id:'add',label:'Добавить норматив',ico:'➕'},
      {id:'addEquip',label:'Добавить оборудование',ico:'🔧'},
      {id:'equipment',label:'Оборудование',ico:'⚙️'}
    ]},
    {group:'Расширенные функции Full',items:[
      {id:'overview-full',label:'Обзор Full',ico:'🔬',full:true},
      {id:'import',label:'Импорт PRO',ico:'📥',full:true},
      {id:'dedup-hard',label:'Дедупликация',ico:'🔎',full:true},
      {id:'ml',label:'ML-прогноз',ico:'🧠',full:true},
      {id:'workflow',label:'Согласование',ico:'✓',full:true},
      {id:'versions',label:'Версии',ico:'🔖',full:true},
      {id:'analytics',label:'Аналитика',ico:'📈',full:true}
    ]},
    {group:'Настройки',items:[
      {id:'settings',label:'Пользователь',ico:'👤'},
      {id:'users',label:'Пользователи',ico:'👥',adminOnly:true},
      {id:'about',label:'О версии',ico:'ℹ️'}
    ]}
  ];
}
function renderNav(){
  const nav = document.getElementById('navScroll');
  const groups = buildNav();
  const role = API.user?.role || 'user';
  nav.innerHTML = groups.map(g => `
    <div class="nav-section">
      <div class="nav-section-title ${g.group.includes('Full')?'full':''}">${g.group}</div>
      ${g.items.map(it => {
        const disabled = it.adminOnly && role !== 'admin';
        return `<div class="nav-item${state.tab===it.id?' active':''}${it.full?' full-only':''}${disabled?' admin-only':''}" ${disabled?'':`data-nav="${it.id}"`}>
          <span class="ico">${it.ico}</span><span>${it.label}</span>${it.badge?`<span class="badge-n">${it.badge}</span>`:''}
        </div>`;
      }).join('')}
    </div>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => {
      state.tab = el.dataset.nav;
      document.getElementById('sidebar').classList.remove('open');
      renderNav(); renderChat();
    };
  });
}
function appendMsg(html, delay=0){
  return new Promise(res => {
    setTimeout(() => {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.innerHTML = `<div class="bubble">${html}</div>`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      res();
    }, delay);
  });
}
function renderChat(){
  const chat = document.getElementById('chat'); chat.innerHTML = '';
  const titles = {
    normatives:'Нормативы', calculator:'Калькулятор', cards:'Тех. карты',
    statistics:'Статистика', add:'Добавить норматив', addEquip:'Добавить оборудование',
    equipment:'Оборудование', about:'О версии', settings:'Пользователь', users:'Пользователи',
    'overview-full':'Обзор Full', import:'Импорт PRO', 'dedup-hard':'Дедупликация',
    ml:'ML-прогноз', workflow:'Согласование', versions:'Версии', analytics:'Аналитика'
  };
  document.getElementById('topbarTitle').textContent = titles[state.tab] || 'Full';
  const fn = TABS[state.tab]; if(fn) fn();
}
function tabNormatives(){
const filtered = getFiltered();
  appendMsg(`
    <div class="bubble-title">🔍 База нормативов</div>
    <div class="bubble-sub" id="normsSub">Найдено: <span class="hl">${filtered.length}</span> из ${state.norms.length}</div>
    <div class="norms-toolbar">
      <input class="search-inp" id="srch" placeholder="🔎 Поиск..." value="${escapeHtml(state.search)}">
      <select class="sel" id="f-sec"><option value="">Все участки</option>${Object.entries(SECTION_NAMES).map(([k,v])=>`<option value="${k}" ${state.fSection===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-cat"><option value="">Все категории</option>${Object.entries(CATEGORY_NAMES).map(([k,v])=>`<option value="${k}" ${state.fCat===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-rep"><option value="">Все типы</option>${Object.entries(REPAIR_NAMES).map(([k,v])=>`<option value="${k}" ${state.fRep===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-src"><option value="">Все источники</option>${Object.entries(SOURCE_NAMES).map(([k,v])=>`<option value="${k}" ${state.fSrc===k?'selected':''}>${v}</option>`).join('')}</select>
      <button class="btn btn-danger btn-xs" id="normsExportPDF">📕 PDF</button>
      <button class="btn btn-xs" style="background:#2b579a;color:#fff;font-weight:700" id="normsExportDOCX">📘 DOCX</button>
    </div>
    <div style="max-height:60vh;overflow-y:auto;padding-right:4px" id="normsListBox">${renderNormsList(filtered)}</div>
  `).then(() => attachNormEvents());
}

function renderNormsList(list){
  if(!list.length) return '<div class="empty"><div class="empty-ico">🔍</div>Ничего не найдено</div>';
  return list.map(n => {
    const inCalc = state.calc.some(c => c.norm.id === n.id);
    const cc = n.confidenceLevel>=0.9?'#4ade80':n.confidenceLevel>=0.7?'#60a5fa':n.confidenceLevel>=0.5?'#facc15':'#f87171';
    const wfStatus = state.workflowStates[n.id]?.status || 'draft';
    const vc = getVersionColor(wfStatus);
    const vs = getVersions(n.id);
    const lv = vs.length ? vs[vs.length-1] : null;
    return `<div class="norm-row">
      <div class="norm-row-head">
        <div class="norm-row-info">
          <div class="norm-row-code">${escapeHtml(n.operationCode)}</div>
          <div class="norm-row-name">${escapeHtml(n.operationName)}</div>
          <div class="norm-row-eq">${SECTION_NAMES[n.section]||''} • ${escapeHtml(n.equipmentType||'')}${lv?` • <span style="color:${vc};font-size:10.5px">v${lv._versionNumber}</span>`:''}</div>
          ${n.tm?`<div class="norm-row-tm"><span class="tm-code">ТМ: ${n.tm}</span></div>`:''}
        </div>
        <div class="norm-row-stats">
          <div class="norm-stat"><div class="norm-stat-v">${n.normValue}</div><div class="norm-stat-l">чел-час</div></div>
          <div class="norm-stat"><div class="norm-stat-v" style="color:${cc};font-size:15px">${(n.confidenceLevel*100).toFixed(0)}%</div><div class="norm-stat-l">достов.</div></div>
        </div>
        <div class="norm-row-actions">
          <button class="btn ${inCalc?'btn-success':'btn-primary'} btn-xs" data-norm-add="${n.id}">${inCalc?'✓ В расчёте':'+ В расчёт'}</button>
          <button class="btn btn-ghost btn-xs" data-norm-del="${n.id}" title="Удалить">🗑</button>
        </div>
      </div>
      <div class="chips" style="margin-top:8px">
        <span class="chip chip-purple">${REPAIR_NAMES[n.repairType]||n.repairType}</span>
        <span class="chip chip-cyan">Сложность ${n.complexity}/5</span>
        <span class="chip chip-blue">${n.teamSize} чел. • ${escapeHtml(n.qualification||'—')}</span>
        <span class="chip chip-green">${escapeHtml(n.sourceCode||'')}</span>
      </div>
    </div>`;
  }).join('');
}

function attachNormEvents(){
  const s = document.getElementById('srch'); if(s) s.oninput = e => { state.search = e.target.value; refreshNormsList(); };
  ['f-sec|fSection','f-cat|fCat','f-rep|fRep','f-src|fSrc'].forEach(p => {
    const [id,key] = p.split('|'); const el = document.getElementById(id);
    if(el) el.onchange = e => { state[key] = e.target.value; refreshNormsList(); };
  });
  bindNormAddButtons();
  const pdfBtn = document.getElementById('normsExportPDF');
  if(pdfBtn) pdfBtn.onclick = () => exportNormsRegistryPDF(getFiltered());
  const docxBtn = document.getElementById('normsExportDOCX');
  if(docxBtn) docxBtn.onclick = () => exportNormsRegistryDOCX(getFiltered());
}
function bindNormAddButtons(){
  document.querySelectorAll('#normsListBox [data-norm-add]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.normAdd;
      const norm = state.norms.find(n => n.id === id); if(!norm) return;
      if(!state.calc.find(c => c.norm.id === id)) state.calc.push({ norm, qty:1 });
      b.className = 'btn btn-success btn-xs'; b.textContent = '✓ В расчёте';
    };
  });
  document.querySelectorAll('#normsListBox [data-norm-del]').forEach(b => {
    b.onclick = async () => {
      if(!confirm('Удалить норматив?')) return;
      const r = await API.del('/api/norms/' + b.dataset.normDel);
      if(r.ok){ showToast('Удалено', 'ok'); await refreshNorms(); renderNav(); renderChat(); }
      else showToast(r.msg || 'Ошибка', 'err');
    };
  });
}
function refreshNormsList(){
  const box = document.getElementById('normsListBox');
  if(box){ box.innerHTML = renderNormsList(getFiltered()); bindNormAddButtons(); }
  const sub = document.getElementById('normsSub');
  if(sub) sub.innerHTML = `Найдено: <span class="hl">${getFiltered().length}</span> из ${state.norms.length}`;
}

/* ═══════════════════════════════════════════════════════════
   ВКЛАДКА: КАЛЬКУЛЯТОР
   ═══════════════════════════════════════════════════════════ */
function tabCalculator(){
  appendMsg(`
    <div class="bubble-title">🧮 Калькулятор</div>
    <div class="bubble-sub">В расчёте: <span class="hl">${state.calc.length}</span> операций</div>
    <div class="calc-wrap">
      <div>
        <input class="search-inp" id="calc-srch" placeholder="🔎 Поиск..." value="${escapeHtml(state.calcSearch)}" style="margin-bottom:10px">
        <div id="calcOpsBox" style="max-height:52vh;overflow-y:auto;padding-right:4px">${renderCalcOps()}</div>
      </div>
      <div class="calc-sidebar" id="calcSidebar">${renderCalcSidebar()}</div>
    </div>
  `).then(() => attachCalcEvents());
}
function renderCalcOps(){
  const list = state.norms.filter(n => {
    const s = state.calcSearch.toLowerCase().trim();
    return !s || (n.operationName||'').toLowerCase().includes(s) || (n.operationCode||'').toLowerCase().includes(s)
      || (n.equipmentType||'').toLowerCase().includes(s) || (n.tm && n.tm.toLowerCase().includes(s));
  }).slice(0, 80);
  if(!list.length) return '<div class="empty"><div class="empty-ico">🔎</div>Ничего не найдено</div>';
  return list.map(n => {
    const inCalc = state.calc.some(c => c.norm.id === n.id);
    return `<div class="norm-row"><div class="norm-row-head">
      <div class="norm-row-info">
        <div class="norm-row-code">${escapeHtml(n.operationCode)}</div>
        <div class="norm-row-name">${escapeHtml(n.operationName)}</div>
        <div class="norm-row-eq">${escapeHtml(n.equipmentType||'')} • ${n.normValue} чел-час</div>
      </div>

function attachCalcEvents(){
  const s = document.getElementById('calc-srch'); if(s) s.oninput = e => { state.calcSearch = e.target.value; refreshCalcOps(); };
  bindCalcEvents();
}
function refreshCalcOps(){ const b = document.getElementById('calcOpsBox'); if(b){ b.innerHTML = renderCalcOps(); bindCalcOpsEvents(); } }
function refreshCalcSidebar(){ const b = document.getElementById('calcSidebar'); if(b){ b.innerHTML = renderCalcSidebar(); bindCalcEvents(); } }
function bindCalcOpsEvents(){
  document.querySelectorAll('#calcOpsBox [data-calc-add]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.calcAdd;
      const norm = state.norms.find(n => n.id === id); if(!norm) return;
      if(!state.calc.find(c => c.norm.id === id)) state.calc.push({ norm, qty:1 });
      refreshCalcOps(); refreshCalcSidebar();
    };
  });
}
function bindCalcEvents(){
  const clr = document.getElementById('calcClear'); if(clr) clr.onclick = () => { state.calc = []; refreshCalcOps(); refreshCalcSidebar(); };
  const crt = document.getElementById('calcCreate'); if(crt) crt.onclick = showCreateCardModal;
  const exp = document.getElementById('calcExport'); if(exp) exp.onclick = exportCsv;
  document.querySelectorAll('#calcSidebar [data-qm]').forEach(b => b.onclick = () => {
    const it = state.calc.find(c => c.norm.id === b.dataset.qm); if(it && it.qty > 1) it.qty--;
    refreshCalcOps(); refreshCalcSidebar();
  });
  document.querySelectorAll('#calcSidebar [data-qp]').forEach(b => b.onclick = () => {
    const it = state.calc.find(c => c.norm.id === b.dataset.qp); if(it) it.qty++;
    refreshCalcOps(); refreshCalcSidebar();
  });
  document.querySelectorAll('#calcSidebar [data-rm]').forEach(b => b.onclick = () => {
    state.calc = state.calc.filter(c => c.norm.id !== b.dataset.rm);
    refreshCalcOps(); refreshCalcSidebar();
  });
}

function handleImportFile(file){
  const ext = file.name.toLowerCase().split('.').pop();
  const reader = new FileReader();
  if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined'){ alert('SheetJS не загружен'); return; }
    reader.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
        if(rows.length < 2){ alert('Файл пустой'); return; }
        renderImportPreview({ headers: rows[0].map(h=>String(h||'').trim()), rows: rows.slice(1).filter(r => r.some(c => String(c||'').trim())) }, file.name);
      }catch(err){ alert('Ошибка XLSX: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = () => {
      const text = reader.result;
      if(ext === 'json'){
        try{
          const data = JSON.parse(text);
          const arr = Array.isArray(data) ? data : (data.custom || data.norms || []);
          if(!arr.length){ alert('Массив пустой'); return; }
          const headers = [...new Set(arr.flatMap(Object.keys))];
          const rows = arr.map(o => headers.map(k => o[k] == null ? '' : String(o[k])));
          renderImportPreview({ headers, rows }, file.name);
        }catch(err){ alert('Ошибка JSON: ' + err.message); }
      } else {
        const rows = parseCSV(text);
        if(rows.length < 2){ alert('CSV пустой'); return; }
        renderImportPreview({ headers: rows[0], rows: rows.slice(1) }, file.name);
      }
    };
    reader.readAsText(file);
  }
}
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const delim = text.split('\n')[0].includes(';') ? ';' : ',';
  const rows = []; let cur = []; let field = ''; let q = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === delim){ cur.push(field); field = ''; }
      else if(ch === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
      else if(ch !== '\r') field += ch;
    }
  }
  if(field || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => String(c||'').trim()));
}
function renderImportPreview(parsed, filename){
  const area = document.getElementById('importPreviewArea');
  const headers = parsed.headers.map(h => h.toLowerCase().trim());
  const colIdx = {};
  const syn = {
    operationCode: ['код','code','шифр','код операции'],
    operationName: ['наименование','название','операция'],
    section: ['участок','section','цех','подразделение'],
    normValue: ['норматив','норма','чел-час','чел-ч','н/ч'],
    repairType: ['тип ремонта','ремонт'],
    tm: ['тм','tm']
  };
  Object.entries(syn).forEach(([k, list]) => {
    for(let i=0; i<headers.length; i++){
      if(list.some(s => headers[i].includes(s))){ colIdx[k] = i; return; }
    }
  });
  const validRows = [];
  const errors = [];
  parsed.rows.forEach((row, idx) => {
    const obj = {};
    Object.entries(colIdx).forEach(([k, i]) => { obj[k] = row[i]; });
    if(!obj.operationCode || !obj.operationName || !obj.normValue){
      errors.push({ row: idx+2, reason: 'Нет operationCode/operationName/normValue' });
      return;
    }
    obj.normValue = parseFloat(String(obj.normValue).replace(',', '.'));
    if(isNaN(obj.normValue)){ errors.push({ row: idx+2, reason: 'normValue не число' }); return; }
    obj.section = obj.section || 'DSP';
    obj.equipmentCategory = 'mechanical';
    obj.equipmentType = obj.equipmentType || 'Не указано';
    validRows.push(obj);
  });
  area.innerHTML = `
    <div class="form-sec-title">📊 Предпросмотр — ${escapeHtml(filename)}</div>
    <div class="grid4">
      <div class="tile"><div class="tile-h">Всего</div><div class="tile-v blue">${parsed.rows.length}</div></div>
      <div class="tile"><div class="tile-h">Валидных</div><div class="tile-v green">${validRows.length}</div></div>
      <div class="tile"><div class="tile-h">Ошибок</div><div class="tile-v red">${errors.length}</div></div>
      <div class="tile"><div class="tile-h">Файл</div><div class="tile-v orange" style="font-size:12px">${escapeHtml(filename)}</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-success" id="confirmProImport" ${validRows.length===0?'disabled':''}>✅ Импортировать ${validRows.length}</button>
      <button class="btn btn-orange" id="dryRunProImport">🧪 Dry-run</button>
      <button class="btn btn-ghost" id="cancelProImport">Отмена</button>
    </div>
    <div id="importProResult" style="margin-top:16px"></div>
  `;
  document.getElementById('confirmProImport').onclick = () => performBulkImport(validRows, false);
  document.getElementById('dryRunProImport').onclick = () => performBulkImport(validRows, true);
  document.getElementById('cancelProImport').onclick = () => { area.innerHTML = ''; };
}

      el.innerHTML = `<div class="grid4">
        <div class="tile" style="text-align:center"><div class="tile-h">Прогноз</div><div class="tile-v orange">${r.predicted}</div><div class="tile-d">чел-час</div></div>
        <div class="tile" style="text-align:center"><div class="tile-h">Диапазон</div><div class="tile-v" style="font-size:16px">${r.lower} — ${r.upper}</div></div>
        <div class="tile" style="text-align:center"><div class="tile-h">Уверенность</div><div class="tile-v ${r.confidence>0.7?'green':r.confidence>0.5?'yellow':'red'}">${(r.confidence*100).toFixed(0)}%</div></div>
        <div class="tile" style="text-align:center"><div class="tile-h">На основе</div><div class="tile-v blue">${r.basedOn}</div></div>

function mlPredict(input){
  const { section, equipmentCategory, complexity = 3, teamSize = 2, repairType = 'ТР' } = input;
  let cand = state.norms.filter(n => {
    let m = 0;
    if(n.section === section) m++;
    if(n.equipmentCategory === equipmentCategory) m++;
    if(n.repairType === repairType) m++;
    return m >= 2;
  });
  if(cand.length < 5) cand = state.norms.filter(n => n.equipmentCategory === equipmentCategory);
  if(cand.length < 3) cand = state.norms;
  if(!cand.length) return { ok:false, msg:'Нет данных' };
  const avgN = cand.reduce((s,n) => s + n.normValue, 0) / cand.length;
  const avgCx = cand.reduce((s,n) => s + n.complexity, 0) / cand.length;
  const avgT = cand.reduce((s,n) => s + n.teamSize, 0) / cand.length;
  const K_cx = 1 + (complexity - avgCx) * 0.12;
  const K_t = 1 + (teamSize - avgT) * 0.05;
  const rk = { 'ТР':0.85, 'СР':1.0, 'КР':1.25 };
  const avgRk = cand.reduce((s,n) => s + (rk[n.repairType]||1), 0) / cand.length;
  const K_r = (rk[repairType] || 1) / avgRk;
  const pred = avgN * K_cx * K_t * K_r;
  const v = cand.reduce((s,n) => s + Math.pow(n.normValue - avgN, 2), 0) / cand.length;
  const cv = avgN ? Math.sqrt(v) / avgN : 1;
  const conf = Math.max(0.3, Math.min(0.95, 0.95 - cv * 0.5 - (cand.length < 10 ? 0.15 : 0)));
  return { ok:true, predicted:+pred.toFixed(1), lower:+(pred*0.85).toFixed(1), upper:+(pred*1.15).toFixed(1), confidence:+conf.toFixed(2), basedOn:cand.length };
}

      state.workflowFilter = filter === el.dataset.wfFilter ? 'all' : el.dataset.wfFilter;
      renderChat();
    });
    document.querySelectorAll('[data-wf-transition]').forEach(btn => btn.onclick = async () => {
      const id = btn.dataset.normId, to = btn.dataset.wfTransition;
      const cur = state.workflowStates[id]?.status || 'draft';
      const c = prompt(`Переход: ${WF_STATUSES[cur].name} → ${WF_STATUSES[to].name}\n\nКомментарий:`, '');
      if(c === null) return;
      const r = await API.post('/api/workflow/transition', { normId: id, to, comment: c });
      if(!r.ok){ showToast(r.msg || 'Ошибка', 'err'); return; }
      state.workflowStates[id] = { status: to, updatedAt: new Date().toISOString(), updatedBy: API.user.login };
      showToast(`Статус: ${WF_STATUSES[r.from].name} → ${WF_STATUSES[r.to].name}`, 'ok');

function renderWFNorm(norm, role){

  const possible = [];
  Object.keys(WF_STATUSES).forEach(toKey => {
    if(toKey !== st && wfCanTransition(st, toKey, role)) possible.push({ to:toKey, label:WF_STATUSES[toKey].name, icon:WF_STATUSES[toKey].icon, color:WF_STATUSES[toKey].color });
  });
  return `<div class="norm-row">

function pluralize(n, one, few, many){ const m10=n%10, m100=n%100; if(m10===1 && m100!==11) return one; if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return few; return many; }
async function tabVersions(){
  // Загрузим версии для всех нормативов (только для тех, где уже могли быть)
  // В целях экономии — только для тех, у которых было изменений.
  const norms = state.norms;
  const withVersions = [];
  for(const n of norms.slice(0, 200)){
    const v = await refreshVersions(n.id);
    if(v.length) withVersions.push({ norm:n, versions: v });
  }
  withVersions.sort((a,b) => b.versions.length - a.versions.length);
  const totalV = withVersions.reduce((s,x) => s+x.versions.length, 0);
  appendMsg(`
    <div class="bubble-title">🔖 Версионирование</div>
    <div class="grid4" style="margin-bottom:16px">
      <div class="tile"><div class="tile-h">С версиями</div><div class="tile-v blue">${withVersions.length}</div></div>
      <div class="tile"><div class="tile-h">Всего версий</div><div class="tile-v green">${totalV}</div></div>
      <div class="tile"><div class="tile-h">Макс.</div><div class="tile-v purple">${withVersions.length ? Math.max(...withVersions.map(x=>x.versions.length)) : 0}</div></div>
      <div class="tile"><div class="tile-h">Нормативов</div><div class="tile-v orange">${norms.length}</div></div>
    </div>
    ${withVersions.length ? withVersions.map(({norm, versions}) => {
      const latest = versions[versions.length-1];
      const lc = getVersionColor(latest._statusSnapshot);
      const ll = latest._statusSnapshot === 'approved' && latest._approvedVersionNumber ? `Утверждённая v${latest._approvedVersionNumber}` : `Версия v${latest._versionNumber}`;
      return `<div class="norm-row">
        <div class="norm-row-head">
          <div class="norm-row-info">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
              <span class="norm-row-code">${escapeHtml(norm.operationCode)}</span>
              <span class="chip" style="background:${lc}22;color:${lc};border:1px solid ${lc}55">${escapeHtml(ll)}</span>
            </div>
            <div class="norm-row-name">${escapeHtml(norm.operationName)}</div>
            <div class="norm-row-eq">${versions.length} ${pluralize(versions.length,'версия','версии','версий')} • последняя: ${new Date(latest._versionAt).toLocaleDateString('ru-RU')}</div>
          </div>
          <div class="norm-row-stats"><div class="norm-stat"><div class="norm-stat-v">${norm.normValue}</div><div class="norm-stat-l">чел-час</div></div></div>
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          <button class="btn btn-orange btn-xs" data-ver-view="${norm.id}">📜 Все версии (${versions.length})</button>
        </div>
      </div>`;
    }).join('') : '<div class="empty"><div class="empty-ico">🔖</div>Версий пока нет</div>'}
  `).then(() => {
    document.querySelectorAll('[data-ver-view]').forEach(b => b.onclick = () => showVersionsModal(b.dataset.verView));
  });
}
async function showVersionsModal(normId){
  const norm = state.norms.find(n => n.id === normId); if(!norm) return;
  const versions = await refreshVersions(normId); if(!versions.length) return;
  const m = document.createElement('div'); m.className = 'modal-ov';

      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px">
        ${versions.map((v, i) => {
          const vc = getVersionColor(v._statusSnapshot);
          const isA = v._statusSnapshot === 'approved';
          return `<div class="tile" style="min-width:200px;${isA?'box-shadow:0 0 0 2px rgba(74,222,128,.3)':''}">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:#fff;font-weight:700;font-size:15px">v${v._versionNumber}</span>${isA?'<span class="chip" style="font-size:9px;background:rgba(74,222,128,.2);color:#4ade80">✅ утв.</span>':''}</div>
            ${v._statusSnapshot?`<div style="font-size:10px;color:${vc};background:${vc}15;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:4px">${escapeHtml(v._statusSnapshot)}</div>`:''}
            <div style="color:var(--muted);font-size:11px">${new Date(v._versionAt).toLocaleString('ru-RU')}</div>
            <div style="color:var(--muted);font-size:11px">👤 ${escapeHtml(v._versionBy||'—')}</div>
            ${v._versionComment?`<div style="color:#93c5fd;font-size:11px;margin-top:6px;font-style:italic">«${escapeHtml(v._versionComment)}»</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn btn-ghost" data-close>Закрыть</button>
        <button class="btn btn-orange" data-revert="${versions[versions.length-1]._versionNumber}">↩ Откатить к v${versions[versions.length-1]._versionNumber}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  m.querySelectorAll('[data-revert]').forEach(b => b.onclick = async () => {
    const tv = parseInt(b.dataset.revert);
    if(!confirm(`Откатить к v${tv}?`)) return;
    const r = await API.post(`/api/versions/${normId}/revert/${tv}`);
    if(r.ok){ showToast(`Создана v${r.versionNumber}`, 'ok'); m.remove(); renderChat(); }
    else showToast(r.msg||'Ошибка', 'err');
  });
}

function tabAnalytics(){
  const norms = state.norms;
  const bySection = {};
  Object.keys(SECTION_NAMES).forEach(k => bySection[k] = { count:0, totalHours:0 });
  let totalHours = 0;
  norms.forEach(n => {
    if(bySection[n.section]){ bySection[n.section].count++; bySection[n.section].totalHours += n.normValue; }
    totalHours += n.normValue;
  });
  const avgConf = norms.length ? (norms.reduce((s,n) => s+n.confidenceLevel, 0)/norms.length*100).toFixed(0) : '0';
  appendMsg(`
    <div class="bubble-title">📈 Аналитика</div>
    <div class="grid4">
      <div class="tile"><div class="tile-h">Нормативов</div><div class="tile-v blue">${norms.length}</div></div>
      <div class="tile"><div class="tile-h">Всего ч/ч</div><div class="tile-v green">${totalHours.toFixed(0)}</div></div>
      <div class="tile"><div class="tile-h">Ср. дост.</div><div class="tile-v yellow">${avgConf}%</div></div>
      <div class="tile"><div class="tile-h">Участков</div><div class="tile-v orange">${Object.values(bySection).filter(s => s.count).length}</div></div>
    </div>
    <div class="form-sec-title" style="margin-top:20px">📊 По участкам</div>
    ${Object.entries(bySection).filter(([k,v]) => v.count > 0).map(([k, v]) => `<div class="stat-bar"><div class="stat-bar-h"><span class="stat-bar-name">${SECTION_NAMES[k]}</span><span class="stat-bar-v">${v.count} (${v.totalHours.toFixed(1)} ч/ч)</span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(v.count/norms.length)*100}%;background:linear-gradient(90deg,#ea580c,#fb923c)"></div></div></div>`).join('')}
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-success" id="xlsFullReport">📊 XLSX полный отчёт</button>
      <button class="btn btn-danger" id="pdfFullReport">📕 PDF полный отчёт</button>
      <button class="btn" style="background:#2b579a;color:#fff" id="docxFullReport">📘 DOCX полный отчёт</button>
    </div>
  `).then(() => {
    document.getElementById('xlsFullReport').onclick = () => exportFullReportXLSX();
    document.getElementById('pdfFullReport').onclick = () => exportFullReportPDF();
    document.getElementById('docxFullReport').onclick = () => exportFullReportDOCX();
  });
}

      const r = await API.post('/api/users', { login:(fd.get('login')||'').trim(), password:fd.get('password'), name:fd.get('name'), role:fd.get('role') });

function pdfReady(){ return typeof window.jspdf !== 'undefined' && window.jspdf.jsPDF && !window.__JSPDF_FAILED; }
function pdfHeader(doc, title, sub){
  const w = doc.internal.pageSize.getWidth();
  doc.setFillColor(30,58,138); doc.rect(0,0,w,22,'F');
  doc.setFillColor(79,70,229); doc.rect(0,22,w,2,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text(title, 12, 11);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(200,210,230);
  doc.text(sub, 12, 17);
  doc.setFontSize(8); doc.text(new Date().toLocaleString('ru-RU'), w-12, 11, { align:'right' });
  doc.text('Full v4.7', w-12, 17, { align:'right' });
  return 28;
}
function pdfFooters(doc){
  const p = doc.internal.getNumberOfPages();
  const w = doc.internal.pageSize.getWidth();
  const h = doc.internal.pageSize.getHeight();
  for(let i=1; i<=p; i++){
    doc.setPage(i);
    doc.setDrawColor(200,210,220); doc.setLineWidth(0.3); doc.line(12, h-12, w-12, h-12);
    doc.setFontSize(7.5); doc.setTextColor(120,130,140); doc.setFont('helvetica','normal');
    doc.text('ЭСП © 2024-2026', 12, h-7);
    doc.text(`Автор: ${API.user?.login||'?'}`, w/2, h-7, { align:'center' });
    doc.text(`Стр. ${i} из ${p}`, w-12, h-7, { align:'right' });
  }
}

  document.body.appendChild(m);
  const tmInp = m.querySelector('#cc-tm');
  tmInp.addEventListener('input', () => autoFormatTM(tmInp));
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  document.getElementById('cc-save').onclick = async () => {
    const tm = (tmInp.value||'').trim();
    const body = {
      cardNumber: document.getElementById('cc-num').value,
      equipmentName: document.getElementById('cc-eq').value,
      tm,
      repairType: document.getElementById('cc-rep').value,
      operations: state.calc.map(i => ({ normativeId: i.norm.id, quantity: i.qty })),
      totalHours: total, calendarDays: days
    };
    const r = await API.post('/api/cards', body);
    if(!r.ok){ alert(r.msg || 'Ошибка'); return; }
    showToast('Техкарта создана', 'ok');
    state.calc = [];
    await loadAll();
    m.remove();
    state.tab = 'cards'; renderNav(); renderChat();
  };
}
function showViewCard(card){
  if(!card) return;
  const m = document.createElement('div'); m.className = 'modal-ov';
  const rows = card.operations.map((op, i) => {
    const n = state.norms.find(x => x.id === op.normativeId); if(!n) return '';
    return `<tr style="border-top:1px solid var(--border-soft)"><td style="padding:8px 12px">${i+1}</td><td style="padding:8px 12px;font-family:monospace;color:#fdba74">${escapeHtml(n.operationCode)}</td><td style="padding:8px 12px;color:#fff">${escapeHtml(n.operationName)}</td><td style="padding:8px 12px;text-align:center">${n.normValue}</td><td style="padding:8px 12px;text-align:center">${op.quantity}</td><td style="padding:8px 12px;text-align:center;font-weight:700">${n.normValue*op.quantity}</td></tr>`;
  }).join('');
  m.innerHTML = `<div class="modal" style="max-width:900px">
    <div class="modal-head"><div><div class="modal-title">${escapeHtml(card.cardNumber)}</div><div style="color:var(--muted);font-size:12px">${escapeHtml(card.equipmentName)}</div></div><button class="modal-close" data-close>×</button></div>
    <div class="modal-body">
      <div class="grid3" style="margin-bottom:14px">
        <div class="tile" style="text-align:center"><div class="tile-v">${card.totalHours}</div><div class="tile-d">чел-час</div></div>
        <div class="tile" style="text-align:center"><div class="tile-v orange">${card.calendarDays}</div><div class="tile-d">дней</div></div>
        <div class="tile" style="text-align:center"><div class="tile-v purple">${card.operations.length}</div><div class="tile-d">операций</div></div>
      </div>
      <div style="background:#111827;border-radius:10px;overflow-x:auto;border:1px solid var(--border)">
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          <thead><tr style="background:#374151;color:var(--muted);font-size:11px;text-transform:uppercase">
            <th style="padding:8px 12px;text-align:left">№</th><th style="padding:8px 12px;text-align:left">Код</th><th style="padding:8px 12px;text-align:left">Операция</th><th style="padding:8px 12px;text-align:center">Норма</th><th style="padding:8px 12px;text-align:center">Кол-во</th><th style="padding:8px 12px;text-align:center">Итого</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-success" id="cardPrint">🖨 Печать</button>
        <button class="btn btn-danger" id="cardPDF">📕 PDF</button>
        <button class="btn" style="background:#7c3aed;color:#fff" id="cardPDFPrint">🖨️ PDF для печати</button>
        <button class="btn" style="background:#2b579a;color:#fff" id="cardDOCX">📘 DOCX</button>
        <button class="btn btn-ghost" id="cardTxt">📥 TXT</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  m.querySelector('#cardPrint').onclick = () => printCard(card);
  m.querySelector('#cardPDF').onclick = () => exportTechCardPDF(card);
  m.querySelector('#cardPDFPrint').onclick = () => { const cn = prompt('Номер экземпляра:', '1'); if(cn === null) return; exportTechCardForPrintPDF(card, { copyNumber: cn.trim() }); };
  m.querySelector('#cardDOCX').onclick = () => exportTechCardDOCX(card);
  m.querySelector('#cardTxt').onclick = () => downloadFile(`ТК_${card.cardNumber}.txt`, generateCardText(card), 'text/plain');
}
function generateCardText(card){
  const ops = card.operations.map((op, i) => { const n = state.norms.find(x => x.id === op.normativeId); return n ? `${i+1}. ${n.operationCode} | ${n.operationName} | ${n.normValue} × ${op.quantity} = ${n.normValue*op.quantity} ч/ч` : ''; }).filter(Boolean).join('\n');
  return `ТК ${card.cardNumber}\nОборудование: ${card.equipmentName}\nТМ: ${card.tm||'—'}\nТип: ${card.repairType}\n\n${ops}\n\nИТОГО: ${card.totalHours} ч/ч\nДней: ${card.calendarDays}`;
}
function printCard(card){
  if(!card) return;
  const rows = card.operations.map((op, i) => {
    const n = state.norms.find(x => x.id === op.normativeId); if(!n) return '';
    return `<tr><td style="border:1px solid #333;padding:5px;text-align:center">${i+1}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:10px">${n.operationCode}</td><td style="border:1px solid #333;padding:5px">${n.operationName}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:9px">${n.tm||'—'}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.normValue}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.unit}</td><td style="border:1px solid #333;padding:5px;text-align:center">${op.quantity}</td><td style="border:1px solid #333;padding:5px;text-align:center;font-weight:bold">${n.normValue*op.quantity}</td></tr>`;
  }).filter(Boolean).join('');
  const w = window.open('', '_blank'); if(!w) return;
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ТК ${card.cardNumber}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;font-size:10pt}.header{text-align:center;margin-bottom:16px;border-bottom:2px solid #000;padding-bottom:8px}table{width:100%;border-collapse:collapse;font-size:9.5pt}th{background:#e5e7eb;border:1px solid #333;padding:5px}.no-print{text-align:center;margin-bottom:16px}@media print{.no-print{display:none}}</style></head><body><div class="no-print"><button onclick="window.print()" style="padding:8px 16px;background:#16a34a;color:white;border:none;border-radius:5px;cursor:pointer">🖨 Печать</button></div><div class="header"><h1>ТЕХНОЛОГИЧЕСКАЯ КАРТА</h1><h2>${card.cardNumber}</h2></div><div style="margin:12px 0"><b>Оборудование:</b> ${card.equipmentName}<br><b>ТМ:</b> ${card.tm||'—'}<br><b>Тип:</b> ${card.repairType}</div><table><thead><tr><th>№</th><th>Код</th><th>Операция</th><th>ТМ</th><th>Норма</th><th>Ед.</th><th>Кол-во</th><th>Итого</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
  w.document.close();
}
function exportCsv(){
  if(!state.calc.length){ alert('Калькулятор пуст'); return; }
  const rows = [['Код','Операция','ТМ','Норматив','Кол-во','Итого']];
  state.calc.forEach(i => rows.push([i.norm.operationCode, i.norm.operationName, i.norm.tm||'', i.norm.normValue, i.qty, i.norm.normValue*i.qty]));
  const csv = rows.map(r => r.join(';')).join('\n');
  downloadFile(`расчёт_${new Date().toISOString().slice(0,10)}.csv`, '\uFEFF'+csv, 'text/csv');
}
function downloadFile(name, content, type){
  const b = new Blob([content], {type: type+';charset=utf-8;'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  URL.revokeObjectURL(u);
}

document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const login = document.getElementById('loginInput').value.trim();
  const pwd = document.getElementById('passwordInput').value;
  btn.disabled = true; btn.textContent = '⏳ Вход...';
  const r = await API.login(login, pwd);
  btn.disabled = false; btn.textContent = '🔐 Войти в систему';
  if(r.ok){
    await loadAll();
    showApp();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = r.msg || 'Неверный логин или пароль';
    err.classList.add('show');
    document.getElementById('passwordInput').value = '';
    setTimeout(() => err.classList.remove('show'), 3000);
  }
};
document.querySelectorAll('.login-account').forEach(el => {
  el.onclick = () => {
    document.getElementById('loginInput').value = el.dataset.login;
    document.getElementById('passwordInput').value = el.dataset.pwd;
    document.getElementById('loginError').classList.remove('show');
  };
});
(async () => {
  if(API.token){
    const r = await API.me();
    if(r.ok){
      await loadAll();
      showApp();
      return;
    }
  }
  showLogin();
})();

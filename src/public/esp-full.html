  const isMobile = isIOS || isAndroid || window.innerWidth < 900;
  function makeCryptoShim(){
    function sha256Fallback(data){
      let h = 2166136261 >>> 0;
      for(let round = 0; round < 10000; round++){
        for(let i = 0; i < data.length; i++){
          h ^= data.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
      }
      return h.toString(16).padStart(8, '0');
    }
    return {
      subtle: {
        digest: async function(algo, buf){
          try{
            const text = new TextDecoder().decode(buf);
            const hex = sha256Fallback(text).repeat(8);
            const out = new Uint8Array(32);
            for(let i = 0; i < 32; i++) out[i] = parseInt(hex.substr(i*2, 2), 16) || 0;
            return out.buffer;
          }catch(e){ return new Uint8Array(32).buffer; }
        }
      }
    };
  }
  try{
    if(!window.crypto) window.crypto = {};
    if(!window.crypto.subtle){
      window.crypto.subtle = makeCryptoShim().subtle;
      console.info('[ESP Mobile] crypto.subtle: установлен полифилл FNV');
    } else {
      (async () => {
        try{ await window.crypto.subtle.digest('SHA-256', new Uint8Array([1,2,3])); }
        catch(e){ window.crypto.subtle = makeCryptoShim().subtle; console.info('[ESP Mobile] crypto.subtle: заменён на FNV'); }
      })();
    }
  }catch(e){ console.warn('[ESP Mobile] crypto patch error:', e); }

    setItem(k, v){ try{ localStorage.setItem(k, v); }catch(e){ memStore.set(k, v); } },
    removeItem(k){ try{ localStorage.removeItem(k); }catch(e){ memStore.delete(k); } }
  };
  const safeSession = {
    getItem(k){ try{ return sessionStorage.getItem(k); }catch(e){ return memStore.has('__s_' + k) ? memStore.get('__s_' + k) : null; } },
    setItem(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){ memStore.set('__s_' + k, v); } },

})(window);

      let out = v.slice(0, 4);
      for(let i = 4; i < v.length; i += GROUP_LEN) out += '-' + v.slice(i, i + GROUP_LEN);

  const Auth = (() => {
    const USERS_KEY = 'users';

    const _DP = ['YWRtaW4xMjM=', 'ZW5nMTIz', 'dXNlcjEyMw=='];
    const _dpw = i => { try{ return atob(_DP[i]); }catch(e){ return ''; } };

      {login:'engineer', password:_dpw(1), name:'Инженер-нормировщик', role:'engineer', createdAt:'2026-01-01'},

        for(let i=0;i<data.length;i++){ h ^= data.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

  const Dedup = (() => {
    function normalize(s){ return String(s||'').toLowerCase().trim().replace(/ё/g,'е').replace(/\s+/g,' ').replace(/[^\wа-я0-9 ]/gi,''); }
    function lev(a, b){
      a = a || ''; b = b || '';
      if(a === b) return 0;
      if(!a.length) return b.length;
      if(!b.length) return a.length;
      const m = Array.from({length:a.length+1}, ()=>new Array(b.length+1).fill(0));
      for(let i=0;i<=a.length;i++) m[i][0]=i;
      for(let j=0;j<=b.length;j++) m[0][j]=j;
      for(let i=1;i<=a.length;i++){ for(let j=1;j<=b.length;j++){ const c = a[i-1]===b[j-1] ? 0 : 1; m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+c); } }

      const r = {blocking:[], warnings:[], info:[]};
      const bc = findByCode(norm.operationCode, col);
      if(bc){
        if(APP.features.dedup === 'hard') r.blocking.push({type:'code', item:bc, msg:'Код "' + norm.operationCode + '" уже существует: "' + bc.operationName + '"'});
        else r.warnings.push({type:'code', item:bc, msg:'Норматив с кодом "' + norm.operationCode + '" уже есть: "' + bc.operationName + '"'});
      }
      const s = findSimilar(norm.operationName, col, 0.75);

<script>
'use strict';
const { TM, Auth, Dedup, Storage, Utils, DICT, Schema, Bus, APP, Plugins } = ESP;
const { SECTION_NAMES, CATEGORY_NAMES, SOURCE_NAMES, REPAIR_NAMES, ROLE_NAMES } = DICT;

// ═══ STATE (все поля сразу — патчи уже интегрированы) ═══
const state = {
  tab:'overview-full', search:'', fSection:'', fCat:'', fRep:'', fSrc:'',
  calc: (() => {
    try {
      const saved = Storage.get('autosave_calc');
      if (Array.isArray(saved)) {
        const valid = saved.filter(item => item && item.norm && item.norm.id);
        console.log('[ESP] Восстановлено из автосохранения:', valid.length, 'операций');
        return valid;
      }
    } catch(e) {}
    return [];
  })(),
  cards: Storage.get('cards', []),
  custom: Storage.get('custom', []),
  customEquip: Storage.get('equip', []),
  calcSearch:'', importTab:'norms', workflowFilter:'all',
  _importParsed:null, _importIsEquip:false, _importFilename:'',
  wfExpanded: new Set(),
  verSelectedNorm: null,
  verCompareA: null,
  verCompareB: null,
  editingNormId: null,
  editingEquipId: null
};
function allNorms(){ return [...BASE_NORMS, ...state.custom]; }
function saveCards(){ Storage.set('cards', state.cards); }
function saveCustom(){ Storage.set('custom', state.custom); }
function saveEquip(){ Storage.set('equip', state.customEquip); }
function getFiltered(){
  return allNorms().filter(n => {
    const s = state.search.toLowerCase().trim();
    const mS = !s || n.operationName.toLowerCase().includes(s) || n.equipmentType.toLowerCase().includes(s) || n.operationCode.toLowerCase().includes(s) || (n.tm && n.tm.toLowerCase().includes(s));
    return mS && (!state.fSection || n.section === state.fSection) && (!state.fCat || n.equipmentCategory === state.fCat) && (!state.fRep || n.repairType === state.fRep) && (!state.fSrc || n.sourceType === state.fSrc);
  });
}

function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginForm').reset();
  document.getElementById('loginError').classList.remove('show');
  setTimeout(() => { try{ document.getElementById('loginInput').focus(); }catch(e){} }, 100);
}
function showApp(){
  try {
    const loginScreen = document.getElementById('loginScreen');
    const app = document.getElementById('app');
    
    if (loginScreen) loginScreen.style.display = 'none';
    if (app) {
      app.classList.remove('hidden');
      app.style.display = 'grid';
    }
    
    if (typeof renderUserBadge === 'function') renderUserBadge();
    if (typeof renderNav === 'function') renderNav();
    if (typeof renderChat === 'function') renderChat();
    
    // Пересчет высоты для iOS Safari
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    
  } catch(e) {
    console.error('[ESP] Ошибка в showApp:', e);
    alert('Ошибка при входе: ' + e.message);
  }
  
  try {
    const lv = Storage.get('last_version', null);
    const sf = Storage.get('switched_from', null);
    if(lv === 'full' && sf === 'lite'){ 
      if (typeof showToast === 'function') showToast('Вы вошли в расширенную версию', 'ok', 4000); 
      Storage.remove('switched_from'); 
    }
  } catch(e) {}
}
function doLogout(){ if(!confirm('Выйти из системы?')) return; Auth.logout(); showLogin(); }
function renderUserBadge(){
  const s = Auth.currentSession(); if(!s) return;
  const initial = (s.name||s.login).charAt(0).toUpperCase();
  document.getElementById('userBadge').innerHTML = '<div class="user-avatar">' + initial + '</div><div><div class="uname">' + Utils.escapeHtml(s.name||s.login) + '</div><div class="urole">' + (ROLE_NAMES[s.role]||s.role) + '</div></div>';
}
function showToast(text, type='info', duration=3000){
  const toast = document.createElement('div'); toast.className = 'full-toast';
  const iconMap = {ok:'✅', info:'ℹ️', warn:'⚠️', err:'❌'};
  toast.innerHTML = '<button class="toast-close" type="button" onclick="this.parentElement.remove()">×</button><div class="toast-icon">' + (iconMap[type]||'ℹ️') + '</div><div><div class="toast-title">' + (type==='ok'?'Готово':type==='err'?'Ошибка':'Информация') + '</div><div class="toast-desc">' + Utils.escapeHtml(text) + '</div></div>';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}
function switchToLite(){
  const s = Auth.currentSession(); if(!s){ alert('Необходимо войти'); return; }
  if(!confirm('Переход в Lite-версию.\nВсе данные сохранятся.\n\nПродолжить?')) return;
  Storage.set('last_version', 'lite');
  Storage.set('switched_from', 'full');
  Storage.set('switched_at', new Date().toISOString());
  Bus.emit('version:switch', {from:'full', to:'lite', user:s.login});
  showToast('Переход в Lite-версию...', 'info');

function renderNormsList(list){

  const isEdit = !!state.editingNormId;
  appendMsg('<div class="bubble-title">' + (isEdit ? '✏️ Редактировать норматив' : '➕ Добавить норматив') + '</div><div class="bubble-sub">HARD-дедупликация</div><div id="addFormWarn"></div><form id="addForm"><div class="form-sec-title">📋 Основная</div><div class="form-row"><div class="form-group"><label class="form-lbl">Код *</label><input class="form-inp" name="operationCode" required autocapitalize="characters" spellcheck="false" placeholder="ДСП-Н-026"></div><div class="form-group"><label class="form-lbl">Участок *</label><select class="form-sel" name="section">' + Object.entries(SECTION_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div></div><div class="form-group"><label class="form-lbl">Наименование *</label><input class="form-inp" name="operationName" required placeholder="Замена/ремонт..."></div><div class="form-row"><div class="form-group"><label class="form-lbl">Категория *</label><select class="form-sel" name="equipmentCategory">' + Object.entries(CATEGORY_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div><div class="form-group"><label class="form-lbl">Тип ремонта</label><select class="form-sel" name="repairType">' + Object.entries(REPAIR_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div></div><div class="form-row"><div class="form-group"><label class="form-lbl">Тип оборудования *</label><input class="form-inp" name="equipmentType" required placeholder="Электродуговая печь"></div><div class="form-group"><label class="form-lbl">Единица</label><input class="form-inp" name="equipmentUnit" placeholder="ДСП-100"></div></div><div class="form-sec-title">🏷️ ТМ</div><div class="form-group"><label class="form-lbl">Код ТМ</label><input class="form-inp tm" name="tm" id="tmInput" maxlength="28" autocomplete="off" inputmode="numeric" placeholder="1201-210-010-010"><div class="form-hint" id="tmHint">Формат: <code>1201-XXX-XXX-XXX-XXX-XXX-XXX</code></div></div><div class="form-sec-title">📐 Норматив</div><div class="form-row"><div class="form-group"><label class="form-lbl">Чел-час *</label><input class="form-inp" type="number" name="normValue" min="0.1" step="0.5" required inputmode="decimal"></div><div class="form-group"><label class="form-lbl">Бригада</label><input class="form-inp" type="number" name="teamSize" value="2" min="1" inputmode="numeric"></div></div><div class="form-row"><div class="form-group"><label class="form-lbl">Квалификация</label><input class="form-inp" name="qualification" placeholder="4-5 разряд"></div><div class="form-group"><label class="form-lbl">Сложность</label><select class="form-sel" name="complexity">' + [1,2,3,4,5].map(i => '<option value="'+i+'" '+(i===3?'selected':'')+'>'+i+'</option>').join('') + '</select></div></div><div class="form-sec-title">📑 Источник</div><div class="form-row"><div class="form-group"><label class="form-lbl">Тип</label><select class="form-sel" name="sourceType">' + Object.entries(SOURCE_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div><div class="form-group"><label class="form-lbl">Код</label><input class="form-inp" name="sourceCode" placeholder="ФЕРп-2001 т.18"></div></div><div class="form-row"><div class="form-group"><label class="form-lbl">Достоверность</label><input class="form-inp" type="number" name="confidenceLevel" value="0.85" min="0" max="1" step="0.05" inputmode="decimal"></div><div class="form-group"><label class="form-lbl">Описание</label><input class="form-inp" name="description"></div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-ghost" id="addFormReset">Сбросить</button><button type="submit" class="btn btn-orange">💾 Сохранить</button></div></form>').then(() => {
    const form = document.getElementById('addForm');
    const tmInp = document.getElementById('tmInput');
    const tmHint = document.getElementById('tmHint');
    const defHint = 'Формат: <code>XXXX</code> или <code>XXXX-XXX</code> … до 7 групп. Пример: <code>1201</code>, <code>1221</code>, <code>1201-210-010</code>';
    
    // Восстановление данных для редактирования
    if (state.editingNormId) {
      const n = allNorms().find(x => x.id === state.editingNormId);
      if (n) {
        form.querySelector('[name="operationCode"]').value = n.operationCode;
        form.querySelector('[name="operationName"]').value = n.operationName;
        form.querySelector('[name="section"]').value = n.section;
        form.querySelector('[name="equipmentCategory"]').value = n.equipmentCategory;
        form.querySelector('[name="repairType"]').value = n.repairType;
        form.querySelector('[name="equipmentType"]').value = n.equipmentType;
        form.querySelector('[name="equipmentUnit"]').value = n.equipmentUnit || '';
        form.querySelector('[name="tm"]').value = n.tm || '';
        form.querySelector('[name="normValue"]').value = n.normValue;
        form.querySelector('[name="teamSize"]').value = n.teamSize;
        form.querySelector('[name="qualification"]').value = n.qualification || '';
        form.querySelector('[name="complexity"]').value = n.complexity;
        form.querySelector('[name="sourceType"]').value = n.sourceType;
        form.querySelector('[name="sourceCode"]').value = n.sourceCode || '';
        form.querySelector('[name="confidenceLevel"]').value = n.confidenceLevel;
        form.querySelector('[name="description"]').value = n.description || '';
        
        const submitBtn = form.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.textContent = '💾 Обновить';
        
        tmInp.dispatchEvent(new Event('input'));
      }
    }
    
    // ═══ УМНЫЙ DRAG & DROP ДЛЯ ТМ ═══
    tmInp.addEventListener('dragover', (e) => { e.preventDefault(); tmInp.style.borderColor = '#fb923c'; });
    tmInp.addEventListener('dragleave', (e) => { e.preventDefault(); tmInp.style.borderColor = ''; });
    tmInp.addEventListener('drop', (e) => {
      e.preventDefault();
      tmInp.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        const regex = /(\b\d{4}(?:-\d{3}){0,6}\b)\s*([^\r\n]*)/g;
        let match;
        const items = [];
        while ((match = regex.exec(text)) !== null) {
          const code = match[1];
          const name = match[2].trim();
          if (!items.find(x => x.code === code)) items.push({ code, name });
        }
        
        if (items.length === 0) { showToast('ТМ-коды не найдены в файле', 'warn'); return; }
        
        const eqType = (form.querySelector('[name="equipmentType"]')?.value || '').toLowerCase();
        const eqUnit = (form.querySelector('[name="equipmentUnit"]')?.value || '').toLowerCase();
        
        let autoFound = null;
        if (eqType || eqUnit) {
           autoFound = items.find(i => i.name.toLowerCase().includes(eqType) || i.name.toLowerCase().includes(eqUnit));
        }
        
        if (autoFound) {
           tmInp.value = autoFound.code;
           tmInp.dispatchEvent(new Event('input'));
           showToast('Автоподстановка: ' + autoFound.code + ' (' + autoFound.name + ')', 'ok');
           return;
        }
        
        if (items.length === 1) {
           tmInp.value = items[0].code;
           tmInp.dispatchEvent(new Event('input'));
           showToast('ТМ-код извлечен: ' + items[0].code, 'ok');
           return;
        }
        
        let existing = document.getElementById('tm-dnd-list');
        if (existing) existing.remove();
        const listDiv = document.createElement('div');
        listDiv.id = 'tm-dnd-list';
        listDiv.style.marginTop = '10px';
        const sel = document.createElement('select');
        sel.className = 'form-sel';
        sel.innerHTML = '<option value="">-- Выберите ТМ из файла (' + items.length + ' шт.) --</option>' + 
          items.map(function(i) { return '<option value="' + i.code + '">' + i.code + (i.name ? ' — ' + i.name : '') + '</option>'; }).join('');
        sel.onchange = () => { if (sel.value) { tmInp.value = sel.value; tmInp.dispatchEvent(new Event('input')); } };
        listDiv.appendChild(sel);
        tmInp.parentNode.appendChild(listDiv);
        showToast('Найдено ' + items.length + ' ТМ-кодов. Выберите нужный в списке.', 'info');
      };
      reader.readAsText(file);
    });
    // ═════════════════════════════════

    tmInp.addEventListener('input', () => {
      tmInp.value = TM.format(tmInp.value);
      const v = tmInp.value.trim();
      if(!v){ tmInp.classList.remove('err','ok'); tmHint.className = 'form-hint'; tmHint.innerHTML = defHint; return; }
      const r = TM.validate(v);
      if(r.ok){ tmInp.classList.add('ok'); tmInp.classList.remove('err'); tmHint.className = 'form-hint ok'; tmHint.textContent = '✓ ' + r.msg; }
      else { tmInp.classList.add('err'); tmInp.classList.remove('ok'); tmHint.className = 'form-hint err'; tmHint.textContent = '✕ ' + r.msg; }
    });
    form.querySelector('#addFormReset').onclick = () => { form.reset(); tmInp.classList.remove('err','ok'); tmHint.className = 'form-hint'; tmHint.innerHTML = defHint; document.getElementById('addFormWarn').innerHTML = ''; };
    
    form.onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const tmVal = (fd.get('tm')||'').trim();
      if(tmVal){ const r = TM.validate(tmVal); if(!r.ok){ document.getElementById('addFormWarn').innerHTML = '<div class="warn-banner err">✕ ТМ: ' + r.msg + '</div>'; return; } }
      const code = (fd.get('operationCode')||'').trim();
      const name = (fd.get('operationName')||'').trim();
      const check = Dedup.check({operationCode:code, operationName:name, tm:tmVal}, allNorms());
      if(check.blocking.length){ document.getElementById('addFormWarn').innerHTML = '<div class="warn-banner err">🚫 ' + check.blocking[0].msg + '</div>'; return; }
      
      if (state.editingNormId) {
        // ЛОГИКА ОБНОВЛЕНИЯ
        const idx = state.custom.findIndex(x => x.id === state.editingNormId);
        if (idx !== -1) {
          const old = state.custom[idx];
          state.custom[idx] = {
            ...old,
            operationCode: code, operationName: name, section: fd.get('section'), 
            equipmentCategory: fd.get('equipmentCategory'), equipmentType: fd.get('equipmentType'), 
            equipmentUnit: fd.get('equipmentUnit')||'', normValue: parseFloat(fd.get('normValue'))||0, 
            teamSize: parseInt(fd.get('teamSize'))||1, qualification: fd.get('qualification')||'', 
            complexity: parseInt(fd.get('complexity'))||3, sourceType: fd.get('sourceType'), 
            sourceCode: fd.get('sourceCode')||'', confidenceLevel: parseFloat(fd.get('confidenceLevel'))||0.7, 
            repairType: fd.get('repairType'), description: fd.get('description')||'', tm: tmVal
          };
          saveCustom();
          Plugins.call('versions','saveVersion', state.custom[idx], 'Изменен');
        }
        state.editingNormId = null; // Сбрасываем режим
        showToast('Норматив обновлен', 'ok');
        state.tab = 'normatives';
        renderNav(); renderChat();
        return;
      } else {
        // ЛОГИКА СОЗДАНИЯ (СТАРАЯ)
        const norm = { id: Utils.uid('custom'), operationCode:code, operationName:name, section: fd.get('section'), equipmentCategory: fd.get('equipmentCategory'), equipmentType: fd.get('equipmentType'), equipmentUnit: fd.get('equipmentUnit')||'', normValue: parseFloat(fd.get('normValue'))||0, unit:'чел-час', teamSize: parseInt(fd.get('teamSize'))||1, qualification: fd.get('qualification')||'', complexity: parseInt(fd.get('complexity'))||3, sourceType: fd.get('sourceType'), sourceCode: fd.get('sourceCode')||'', confidenceLevel: parseFloat(fd.get('confidenceLevel'))||0.7, repairType: fd.get('repairType'), description: fd.get('description')||'', toolsRequired: [], safetyRequirements: [], actualAvg: undefined, deviationPct: 0, tm: tmVal, isCustom: true, author: Auth.currentSession()?.login || 'unknown', createdAt: new Date().toISOString() };
        state.custom.push(norm); saveCustom();
        Plugins.call('versions','saveVersion', norm, 'Создан');
        appendMsg('<div class="bubble-title">✅ Норматив добавлен</div><p>Код: <code>' + Utils.escapeHtml(norm.operationCode) + '</code></p>');
        form.reset(); tmInp.classList.remove('err','ok'); tmHint.className = 'form-hint'; tmHint.innerHTML = defHint;
      }
    };
  });
}

/* ═══ ОБОРУДОВАНИЕ ═══ */
function tabEquipment(){
  const eqBySection = {};
  allNorms().forEach(n => { if(!eqBySection[n.section]) eqBySection[n.section] = {types:new Set(), ops:0}; eqBySection[n.section].types.add(n.equipmentType); eqBySection[n.section].ops++; });
  appendMsg('<div class="bubble-title">⚙️ Оборудование</div><div class="form-sec-title">🏭 По участкам</div>' + Object.entries(eqBySection).map(([sec, d]) => '<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px"><span style="color:#fff;font-weight:700">' + SECTION_NAMES[sec] + '</span><span class="badge-mini">' + d.types.size + ' типов • ' + d.ops + ' операций</span></div><div style="display:flex;flex-wrap:wrap;gap:4px">' + [...d.types].map(t => '<span class="chip chip-orange" style="font-size:10.5px">' + Utils.escapeHtml(t) + '</span>').join('') + '</div></div>').join('') + '<div class="form-sec-title" style="margin-top:16px">🔧 Пользовательское (' + state.customEquip.length + ')</div>' + (state.customEquip.map(eq => '<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div style="font-family:monospace;font-size:11.5px;color:#fdba74">' + Utils.escapeHtml(eq.code) + '</div><div style="color:#fff;font-weight:600">' + Utils.escapeHtml(eq.type) + ' — ' + Utils.escapeHtml(eq.unit) + '</div>' + (eq.tm?'<div style="margin-top:4px"><span class="tm-code">ТМ: ' + eq.tm + '</span></div>':'') + '</div><div style="display:flex;gap:6px">' + (Auth.currentSession()?.role === 'admin' ? `<button class="btn btn-ghost btn-xs" type="button" data-edit-eq="${eq.id}">✏️</button>` : '') + '<button class="btn btn-danger btn-xs" type="button" data-del-eq="' + eq.id + '">🗑</button></div></div></div>').join('') || '<div class="empty">Пока нет</div>')).then(() => {
    document.querySelectorAll('[data-del-eq]').forEach(b => b.onclick = () => { if(confirm('Удалить?')){ state.customEquip = state.customEquip.filter(e => e.id !== b.dataset.delEq); saveEquip(); renderChat(); } });
    document.querySelectorAll('[data-edit-eq]').forEach(b => b.onclick = () => { state.editingEquipId = b.dataset.editEq; state.tab = 'addEquip'; renderNav(); renderChat(); });
  });
}

/* ═══ ИМПОРТ PRO ═══ */
function tabImport(){
  appendMsg('<div class="bubble-title">📥 Импорт PRO</div><div class="warn-banner info">ℹ️ <div>Поддерживаются <b>XLSX</b>, <b>CSV</b>, <b>JSON</b></div></div><div class="grid4"><div class="tile clickable" data-import-tab="norms"><div class="tile-h">📋 Нормативы</div></div><div class="tile clickable" data-import-tab="equipment"><div class="tile-h">🔧 Оборудование</div></div><div class="tile clickable" data-import-tab="history"><div class="tile-h">📜 История</div></div></div><div id="importArea" style="margin-top:20px"></div>').then(() => { document.querySelectorAll('[data-import-tab]').forEach(el => el.onclick = () => renderImportProTab(el.dataset.importTab)); renderImportProTab('norms'); });
}
function renderImportProTab(tab){
  const area = document.getElementById('importArea'); if(!area) return;
  if(tab === 'history'){ const h = Plugins.call('import-pro','getHistory'); area.innerHTML = '<div class="form-sec-title">📜 История</div>' + (h.length ? h.map(x => '<div class="tile" style="margin-bottom:8px"><span class="chip chip-orange">' + x.type + '</span> <b>' + Utils.escapeHtml(x.filename||'—') + '</b><br>✅ +' + x.added + ' · 🔄 ' + x.updated + ' · ⏭ ' + x.skipped + '</div>').join('') : '<div class="empty">Пусто</div>'); return; }
  const isEq = tab === 'equipment';
  area.innerHTML = '<div class="form-sec-title">📥 Загрузка</div><div id="dropZone" style="border:2px dashed var(--border);border-radius:14px;padding:32px;text-align:center;cursor:pointer;background:rgba(15,23,42,.4)"><div style="font-size:48px;opacity:.6">📂</div><div style="color:#fff;font-weight:600;margin-top:12px">Нажмите для выбора файла</div><input type="file" id="importFileInput" accept=".xlsx,.xls,.csv,.txt,.json" style="display:none"></div><div class="form-sec-title" style="margin-top:16px">⚙️ Опции</div><div class="grid2"><label style="display:flex;align-items:center;gap:8px;padding:10px;background:#111827;border:1px solid var(--border);border-radius:8px"><input type="checkbox" id="optUpdate"> Upsert</label></div><div id="importPreviewArea" style="margin-top:20px"></div><div style="margin-top:20px"><button class="btn btn-ghost btn-xs" type="button" id="tmplBtn">📄 Шаблон CSV</button></div>';
  const dz = document.getElementById('dropZone'); const fi = document.getElementById('importFileInput');
  dz.addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => { if(e.target.files.length) handleFiles(e.target.files[0], isEq); e.target.value = ''; });
  document.getElementById('tmplBtn').onclick = () => { const csv = Plugins.call('import-pro','generateTemplateCSV'); Utils.download('шаблон.csv', '\uFEFF'+csv, 'text/csv'); };
}
function handleFiles(file, isEq){
  const fmt = Plugins.call('import-pro','detectFormat', null, file.name);
  if(fmt === 'unknown'){ alert('Формат не поддерживается'); return; }
  if(fmt === 'xlsx'){ Plugins.call('import-pro','parseXLSX', file).then(parsed => { if(!parsed.ok){ alert(parsed.msg); return; } processParsed(parsed, isEq, file.name); }).catch(err => alert(err.message)); }
  else { const reader = new FileReader(); reader.onload = () => { const parsed = fmt === 'json' ? Plugins.call('import-pro','parseJSONRaw', reader.result) : Plugins.call('import-pro','parseCSVRaw', reader.result); if(!parsed.ok){ alert(parsed.msg); return; } processParsed(parsed, isEq, file.name); }; reader.readAsText(file); }
}
function processParsed(parsed, isEq, filename){ state._importParsed = parsed; state._importIsEquip = isEq; state._importFilename = filename; renderPreview(parsed, isEq); }
function renderPreview(parsed, isEq){
  const area = document.getElementById('importPreviewArea'); if(!area) return;
  const columns = isEq ? Plugins.call('import-pro','EQUIP_COLUMNS') : Plugins.call('import-pro','NORM_COLUMNS');
  const mapping = Plugins.call('import-pro','autoMap', parsed.headers, columns);
  const result = Plugins.call('import-pro','parseWithProfile', parsed, columns, mapping);
  area.innerHTML = '<div class="form-sec-title">📊 Предпросмотр</div><div class="grid4"><div class="tile"><div class="tile-h">Всего</div><div class="tile-v blue">' + parsed.rows.length + '</div></div><div class="tile"><div class="tile-h">Валидных</div><div class="tile-v green">' + result.valid.length + '</div></div><div class="tile"><div class="tile-h">Ошибок</div><div class="tile-v red">' + result.errorRows.length + '</div></div><div class="tile"><div class="tile-h">Файл</div><div class="tile-v orange" style="font-size:12px">' + Utils.escapeHtml(state._importFilename) + '</div></div></div><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn btn-success" type="button" id="confirmProImport" ' + (result.valid.length===0?'disabled':'') + '>✅ Импортировать ' + result.valid.length + '</button><button class="btn btn-orange" type="button" id="dryRunProImport">🧪 Dry-run</button><button class="btn btn-ghost" type="button" id="cancelProImport">Отмена</button></div><div id="importProResult" style="margin-top:16px"></div>';
  document.getElementById('confirmProImport').onclick = () => performImport(result.valid, isEq, false);
  document.getElementById('dryRunProImport').onclick = () => performImport(result.valid, isEq, true);
  document.getElementById('cancelProImport').onclick = () => { area.innerHTML = ''; };
}
function performImport(items, isEq, dryRun){
  const upd = document.getElementById('optUpdate')?.checked || false;
  const resultEl = document.getElementById('importProResult');
  let result;
  if(isEq) result = Plugins.call('import-pro','upsertEquipment', items, state.customEquip, {updateExisting:upd, dryRun});
  else result = Plugins.call('import-pro','upsertNorms', items, allNorms(), {updateExisting:upd, dryRun});
  resultEl.innerHTML = '<div class="warn-banner ' + (dryRun?'info':'ok') + '"><b>' + (dryRun?'🧪 Dry-run':'✅ Импорт завершён') + '</b></div><div class="grid4"><div class="tile"><div class="tile-h">Добавлено</div><div class="tile-v green">' + result.added.length + '</div></div><div class="tile"><div class="tile-h">Обновлено</div><div class="tile-v blue">' + result.updated.length + '</div></div><div class="tile"><div class="tile-h">Пропущено</div><div class="tile-v yellow">' + result.skipped.length + '</div></div><div class="tile"><div class="tile-h">Заблок.</div><div class="tile-v red">' + (result.blocked?.length || 0) + '</div></div></div>';
  if(!dryRun){
    if(isEq){ result.added.forEach(eq => state.customEquip.push(eq)); saveEquip(); } else { result.added.forEach(n => state.custom.push(n)); saveCustom(); }
    Plugins.call('import-pro','setLastImport', {type: isEq ? 'equipment' : 'norms', addedIds: result.added.map(x => x.id), appliedAt: new Date().toISOString(), filename: state._importFilename || ''});
    Plugins.call('import-pro','pushHistory', {type: isEq ? 'Оборудование' : 'Нормативы', filename: state._importFilename || '', added: result.added.length, updated: result.updated.length, skipped: result.skipped.length, blocked: result.blocked?.length || 0, author: Auth.currentSession()?.login || '?', at: new Date().toISOString()});
    showToast('Импорт: +' + result.added.length + ' / обновлено ' + result.updated.length, 'ok');
  }
}

/* ═══ ML ═══ */
function tabML(){
  appendMsg('<div class="bubble-title">🧠 ML-прогноз</div><form id="mlForm"><div class="form-row"><div class="form-group"><label class="form-lbl">Участок</label><select class="form-sel" name="section">' + Object.entries(SECTION_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div><div class="form-group"><label class="form-lbl">Категория</label><select class="form-sel" name="equipmentCategory">' + Object.entries(CATEGORY_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join('') + '</select></div></div><div class="form-row"><div class="form-group"><label class="form-lbl">Тип ремонта</label><select class="form-sel" name="repairType">' + Object.entries(REPAIR_NAMES).map(([k,v]) => '<option value="'+k+'" '+(k==='СР'?'selected':'')+'>'+v+'</option>').join('') + '</select></div><div class="form-group"><label class="form-lbl">Сложность</label><select class="form-sel" name="complexity">' + [1,2,3,4,5].map(i => '<option value="'+i+'" '+(i===3?'selected':'')+'>'+i+'</option>').join('') + '</select></div></div><div class="form-group"><label class="form-lbl">Бригада</label><input class="form-inp" type="number" name="teamSize" value="3" min="1" inputmode="numeric"></div><button type="submit" class="btn btn-orange">🧠 Спрогнозировать</button></form><div id="mlResult" style="margin-top:16px"></div>').then(() => {
    document.getElementById('mlForm').onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = Plugins.call('ml','predictNorm', { section: fd.get('section'), equipmentCategory: fd.get('equipmentCategory'), repairType: fd.get('repairType'), complexity: parseInt(fd.get('complexity')), teamSize: parseInt(fd.get('teamSize')) }, allNorms());
      const el = document.getElementById('mlResult');
      if(!r.ok){ el.innerHTML = '<div class="warn-banner err">✕ ' + r.msg + '</div>'; return; }
      el.innerHTML = '<div class="grid4"><div class="tile" style="text-align:center"><div class="tile-h">Прогноз</div><div class="tile-v orange">' + r.predicted + '</div><div class="tile-d">чел-час</div></div><div class="tile" style="text-align:center"><div class="tile-h">Диапазон</div><div class="tile-v" style="font-size:16px">' + r.lower + ' — ' + r.upper + '</div></div><div class="tile" style="text-align:center"><div class="tile-h">Уверенность</div><div class="tile-v ' + (r.confidence>0.7?'green':r.confidence>0.5?'yellow':'red') + '">' + (r.confidence*100).toFixed(0) + '%</div></div><div class="tile" style="text-align:center"><div class="tile-h">На основе</div><div class="tile-v blue">' + r.basedOn + '</div></div></div>';
    };
  });
}

/* ═══ WORKFLOW (полный UI встроен) ═══ */
function wfColor(c){ return {gray:'#94a3b8',yellow:'#fde047',green:'#4ade80',red:'#f87171'}[c] || '#94a3b8'; }
function wfBg(c){ return {gray:'rgba(148,163,184,.12)',yellow:'rgba(234,179,8,.15)',green:'rgba(34,197,94,.12)',red:'rgba(220,38,38,.12)'}[c] || 'rgba(148,163,184,.12)'; }
function tabWorkflow(){
  const STATUSES = Plugins.call('workflow','STATUSES');
  const stats = Plugins.call('workflow','getStats');
  const session = Auth.currentSession();
  const all = allNorms().map(n => ({norm:n, status: Plugins.call('workflow','getState',n.id).status}));
  const filt = state.workflowFilter === 'all' ? all : all.filter(x => x.status === state.workflowFilter);
  appendMsg('<div class="bubble-title">✓ Согласование</div><div class="bubble-sub">Маршрут согласования нормативов</div><div style="background:#111827;border-radius:14px;padding:18px;border:1px solid var(--border);margin-bottom:16px"><div style="display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap">' + ['draft','review','approved','archived'].map((k,i) => { const s = STATUSES[k]; const c = wfColor(s.color); const count = stats[k] || 0; return '<div style="padding:10px 16px;border-radius:12px;background:' + wfBg(s.color) + ';border:2px solid ' + c + '55;text-align:center;min-width:110px"><div style="font-size:22px">' + s.icon + '</div><div style="color:' + c + ';font-weight:700;font-size:12.5px;margin-top:4px">' + s.name + '</div><div style="color:#fff;font-weight:800;font-size:16px;margin-top:2px">' + count + '</div></div>' + (i < 3 ? '<div style="color:#64748b;font-size:20px">→</div>' : ''); }).join('') + '</div><div style="display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap"><div style="color:#64748b;font-size:13px;align-self:center">↳ при отклонении:</div><div style="padding:8px 14px;border-radius:10px;background:' + wfBg('red') + ';border:2px solid ' + wfColor('red') + '55;text-align:center"><div style="font-size:18px">❌</div><div style="color:' + wfColor('red') + ';font-weight:700;font-size:12px">Отклонён</div><div style="color:#fff;font-weight:800;font-size:14px">' + (stats.rejected||0) + '</div></div><div style="color:#64748b;font-size:16px;align-self:center">→</div><div style="padding:8px 14px;border-radius:10px;background:#0f172a;border:2px solid #374151;text-align:center"><div style="font-size:18px">↩</div><div style="color:#cbd5e1;font-weight:700;font-size:12px">Черновик</div></div></div></div><div class="grid4" style="margin-bottom:16px">' + Object.entries(STATUSES).map(([k,s]) => '<div class="tile clickable" data-wf-filter="' + k + '" style="' + (state.workflowFilter===k?'border-color:var(--accent)':'') + '"><div class="tile-h">' + s.icon + ' ' + s.name + '</div><div class="tile-v" style="color:' + wfColor(s.color) + '">' + (stats[k]||0) + '</div></div>').join('') + '</div><div class="form-sec-title">📋 Нормативы (' + filt.length + ')</div>' + filt.slice(0, 50).map(({norm, status}) => renderWFNorm(norm, status, STATUSES, session)).join('')).then(() => {
    document.querySelectorAll('[data-wf-filter]').forEach(el => el.onclick = () => { state.workflowFilter = state.workflowFilter === el.dataset.wfFilter ? 'all' : el.dataset.wfFilter; renderChat(); });
    document.querySelectorAll('[data-wf-transition]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.normId, to = btn.dataset.wfTransition;
        const cur = Plugins.call('workflow','getState',id).status;
        const c = prompt('Переход: ' + STATUSES[cur].name + ' → ' + STATUSES[to].name + '\n\nКомментарий:', '');
        if(c === null) return;
        const r = Plugins.call('workflow','transition', id, to, c);
        if(r.ok){ showToast('Статус: ' + STATUSES[r.from].name + ' → ' + STATUSES[r.to].name, 'ok'); renderChat(); }
        else showToast('Ошибка: ' + r.msg, 'err');
      };
    });
    document.querySelectorAll('[data-wf-history]').forEach(btn => btn.onclick = () => showWFHistoryModal(btn.dataset.wfHistory));
    document.querySelectorAll('[data-wf-toggle]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        state.wfExpanded = state.wfExpanded || new Set();
        if(state.wfExpanded.has(b.dataset.wfToggle)) state.wfExpanded.delete(b.dataset.wfToggle);
        else state.wfExpanded.add(b.dataset.wfToggle);
        renderChat();
      };
    });
    document.querySelectorAll('[data-ver-norm]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        state.verSelectedNorm = b.dataset.verNorm;
        state.tab = 'versions';
        renderNav(); renderChat();
      };
    });
  });
}
function renderWFNorm(norm, status, STATUSES, session){
  const s = STATUSES[status];
  const role = session?.role || 'user';
  const possible = [];
  Object.keys(STATUSES).forEach(toKey => { if(toKey !== status && Plugins.call('workflow','canTransition', status, toKey, role)) possible.push({to:toKey, label:STATUSES[toKey].name, icon:STATUSES[toKey].icon, color:STATUSES[toKey].color}); });
  const expanded = state.wfExpanded && state.wfExpanded.has(norm.id);
  const hist = Plugins.call('workflow','getNormHistory', norm.id);
  const verCount = Plugins.call('versions','getVersions', norm.id).length;
  return '<div class="norm-row"><div class="norm-row-head"><div class="norm-row-info"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap"><span class="norm-row-code">' + Utils.escapeHtml(norm.operationCode) + '</span><span class="chip" style="background:' + wfBg(s.color) + ';color:' + wfColor(s.color) + ';border:1px solid ' + wfColor(s.color) + '55">' + s.icon + ' ' + s.name + '</span></div><div class="norm-row-name">' + Utils.escapeHtml(norm.operationName) + '</div></div><div class="norm-row-stats"><div class="norm-stat"><div class="norm-stat-v">' + norm.normValue + '</div><div class="norm-stat-l">чел-час</div></div></div></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-orange btn-xs" type="button" data-wf-toggle="' + norm.id + '">' + (expanded ? '▲ Свернуть' : '▼ Управление') + '</button><button class="btn btn-ghost btn-xs" type="button" data-wf-history="' + norm.id + '">📜 История</button>' + possible.map(t => '<button class="btn btn-xs" type="button" data-wf-transition="' + t.to + '" data-norm-id="' + norm.id + '" style="background:' + wfBg(t.color) + ';color:' + wfColor(t.color) + ';border:1px solid ' + wfColor(t.color) + '55">' + t.icon + ' ' + t.label + '</button>').join('') + '</div>' + (expanded ? '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div style="font-size:11px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:8px">Все статусы маршрута</div><div style="display:flex;flex-direction:column;gap:6px">' + ['draft','review','approved','rejected','archived'].map(k => { const isCur = k === status; const s2 = STATUSES[k]; const c = wfColor(s2.color); return '<div style="padding:8px 12px;border-radius:8px;background:' + (isCur ? wfBg(s2.color) : '#0f172a') + ';border:1px solid ' + (isCur ? c + '66' : '#374151') + ';display:flex;align-items:center;gap:10px"><span style="font-size:16px">' + s2.icon + '</span><span style="color:' + (isCur ? c : '#cbd5e1') + ';font-weight:' + (isCur ? '700' : '500') + ';font-size:12.5px">' + s2.name + '</span>' + (isCur ? '<span style="margin-left:auto;font-size:10px;color:#fdba74;font-weight:700">ТЕКУЩИЙ</span>' : '') + '</div>'; }).join('') + '</div></div><div><div style="font-size:11px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:8px">История переходов</div>' + (!hist.length ? '<div style="color:var(--muted);font-size:12px;padding:12px;background:#0f172a;border-radius:8px;text-align:center">История пуста</div>' : '<div style="max-height:200px;overflow-y:auto;background:#0f172a;border-radius:8px;padding:8px">' + hist.slice().reverse().map(h => '<div style="padding:6px 8px;border-bottom:1px solid rgba(51,65,85,.3);font-size:11.5px"><div style="color:#cbd5e1">' + (STATUSES[h.from]?.name||h.from) + ' → <b style="color:#fff">' + (STATUSES[h.to]?.name||h.to) + '</b></div>' + (h.comment ? '<div style="color:var(--muted);font-size:11px;margin-top:2px">💬 ' + Utils.escapeHtml(h.comment) + '</div>' : '') + '<div style="color:var(--dim);font-size:10.5px;margin-top:2px"><code>' + Utils.escapeHtml(h.by) + '</code> · ' + new Date(h.at).toLocaleString('ru-RU') + '</div></div>').join('') + '</div>') + '</div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-xs" type="button" data-ver-norm="' + norm.id + '">🔖 Версии (' + verCount + ')</button></div></div>' : '') + '</div>';
}
function showWFHistoryModal(normId){
  const norm = allNorms().find(n => n.id === normId); if(!norm) return;
  const hist = Plugins.call('workflow','getNormHistory', normId);
  const STATUSES = Plugins.call('workflow','STATUSES');
  const cur = Plugins.call('workflow','getState',normId).status;
  const m = document.createElement('div'); m.className = 'modal-ov';
  m.innerHTML = '<div class="modal" style="max-width:640px"><div class="modal-head"><div><div class="modal-title">📜 История</div><div style="color:var(--muted);font-size:12px">' + Utils.escapeHtml(norm.operationCode) + '</div></div><button class="modal-close" type="button" data-close>×</button></div><div class="modal-body"><div style="background:' + wfBg(STATUSES[cur].color) + ';border-radius:10px;padding:14px;margin-bottom:16px;text-align:center"><div style="font-size:20px;font-weight:700;color:' + wfColor(STATUSES[cur].color) + '">' + STATUSES[cur].icon + ' ' + STATUSES[cur].name + '</div></div>' + (hist.length ? hist.slice().reverse().map(t => '<div style="background:#111827;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border)"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span style="color:' + wfColor(STATUSES[t.from].color) + '">' + STATUSES[t.from].name + '</span> → <span style="color:' + wfColor(STATUSES[t.to].color) + '">' + STATUSES[t.to].name + '</span><span style="color:var(--dim);font-size:11px">' + new Date(t.at).toLocaleString('ru-RU') + '</span></div><div style="margin-top:6px">👤 ' + Utils.escapeHtml(t.by) + '</div>' + (t.comment?'<div style="margin-top:6px;font-style:italic;color:#cbd5e1">«' + Utils.escapeHtml(t.comment) + '»</div>':'') + '</div>').join('') : '<div class="empty">Пусто</div>') + '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" type="button" data-close>Закрыть</button></div></div></div>';
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
}

/* ═══ VERSIONS (полный UI встроен) ═══ */
function pluralize(n, one, few, many){ const m10 = n%10, m100 = n%100; if(m10===1 && m100!==11) return one; if(m10>=2 && m10<=4 && (m100<10 || m100>=20)) return few; return many; }
function tabVersions(){
  const stats = Plugins.call('versions','getStats');
  const nwv = allNorms().map(n => ({norm:n, versions:Plugins.call('versions','getVersions',n.id)})).filter(x => x.versions.length).sort((a,b) => b.versions.length - a.versions.length);
  const selectedId = state.verSelectedNorm;
  const selectedNorm = selectedId ? allNorms().find(n => n.id === selectedId) : null;
  const filteredNwv = selectedNorm ? nwv.filter(x => x.norm.id === selectedId) : nwv;
  appendMsg('<div class="bubble-title">🔖 Версионирование</div><div class="grid4" style="margin-bottom:16px"><div class="tile"><div class="tile-h">С версиями</div><div class="tile-v blue">' + stats.normsWithVersions + '</div></div><div class="tile"><div class="tile-h">Всего версий</div><div class="tile-v green">' + stats.total + '</div></div><div class="tile"><div class="tile-h">Макс.</div><div class="tile-v purple">' + stats.maxVersion + '</div></div><div class="tile"><div class="tile-h">Нормативов</div><div class="tile-v orange">' + allNorms().length + '</div></div></div>' + (nwv.length ? '<div class="form-sec-title" style="margin-top:20px">📋 Выбор норматива</div><select class="sel" id="verNormSelect" style="width:100%;padding:10px;margin-bottom:12px"><option value="">— Все нормативы с версиями (' + nwv.length + ') —</option>' + nwv.slice(0, 200).map(({norm, versions}) => '<option value="' + norm.id + '" ' + (norm.id === selectedId ? 'selected' : '') + '>' + Utils.escapeHtml(norm.operationCode) + ' — ' + Utils.escapeHtml(norm.operationName) + ' (' + versions.length + ' версий)</option>').join('') + '</select>' + filteredNwv.map(({norm, versions}) => renderVerNorm(norm, versions)).join('') : '<div class="empty"><div class="empty-ico">🔖</div>Нормативов с версиями нет</div>')).then(() => {
    const verSel = document.getElementById('verNormSelect');
    if(verSel){ verSel.onchange = (e) => { state.verSelectedNorm = e.target.value || null; renderChat(); }; }
    document.querySelectorAll('[data-ver-view]').forEach(b => b.onclick = () => showVersionsModal(b.dataset.verView));
  });
}
function renderVerNorm(norm, versions){
  const latest = versions[versions.length-1];
  const ap = versions.filter(v => v._statusSnapshot === 'approved');
  const lc = Plugins.call('versions','getVersionColor', latest._statusSnapshot);
  const ll = Plugins.call('versions','buildVersionLabel', latest);
  return '<div class="norm-row"><div class="norm-row-head"><div class="norm-row-info"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap"><span class="norm-row-code">' + Utils.escapeHtml(norm.operationCode) + '</span>' + (latest._statusSnapshot ? '<span class="chip" style="background:' + lc + '22;color:' + lc + ';border:1px solid ' + lc + '55">' + ll + '</span>' : '') + '</div><div class="norm-row-name">' + Utils.escapeHtml(norm.operationName) + '</div><div class="norm-row-eq">' + versions.length + ' ' + pluralize(versions.length,'версия','версии','версий') + ' • ' + new Date(latest._versionAt).toLocaleDateString('ru-RU') + '</div></div><div class="norm-row-stats"><div class="norm-stat"><div class="norm-stat-v">' + norm.normValue + '</div><div class="norm-stat-l">чел-час</div></div>' + (ap.length?'<div class="norm-stat"><div class="norm-stat-v" style="color:#4ade80;font-size:14px">' + ap.length + '</div><div class="norm-stat-l">утв.</div></div>':'') + '</div></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-orange btn-xs" type="button" data-ver-view="' + norm.id + '">📜 Все версии (' + versions.length + ')</button></div></div>';
}
function showVersionsModal(normId){
  const norm = allNorms().find(n => n.id === normId); if(!norm) return;
  const versions = Plugins.call('versions','getVersions', normId); if(!versions.length) return;
  let sel = versions.length;
  const m = document.createElement('div'); m.className = 'modal-ov';

  function renderCompare(){
    const el = m.querySelector('#verCompareResult'); if(!el) return;
    const a = state.verCompareA, b = state.verCompareB;
    if(!a || !b){ el.innerHTML = '<div style="color:var(--muted);font-size:12.5px;padding:16px;background:#0f172a;border-radius:10px;text-align:center">Выберите две версии для сравнения</div>'; return; }
    if(a === b){ el.innerHTML = '<div class="warn-banner">⚠️ Выберите разные версии</div>'; return; }
    const vA = versions.find(v => v._versionNumber === a);
    const vB = versions.find(v => v._versionNumber === b);
    if(!vA || !vB){ el.innerHTML = '<div class="warn-banner err">Версии не найдены</div>'; return; }
    const result = Plugins.call('versions','diffVersions', vA, vB);
    const diffs = (result && result.changes) || [];
    if(!diffs.length){ el.innerHTML = '<div style="padding:16px;text-align:center;color:#86efac;background:#0f172a;border-radius:10px">✅ Версии идентичны</div>'; return; }
    el.innerHTML = '<div style="background:#111827;border-radius:10px;overflow:hidden;border:1px solid var(--border)"><div style="display:grid;grid-template-columns:1fr 1fr;background:#0f172a;border-bottom:1px solid var(--border)"><div style="padding:10px 12px;color:#fca5a5;font-weight:700;text-align:center;border-right:1px solid var(--border);font-size:12px">📌 v' + vA._versionNumber + ' <span style="color:var(--muted);font-weight:400">(' + new Date(vA._versionAt).toLocaleDateString('ru-RU') + ')</span></div><div style="padding:10px 12px;color:#86efac;font-weight:700;text-align:center;font-size:12px">📌 v' + vB._versionNumber + ' <span style="color:var(--muted);font-weight:400">(' + new Date(vB._versionAt).toLocaleDateString('ru-RU') + ')</span></div></div>' + diffs.map(d => { const before = Array.isArray(d.before) ? d.before.join(', ') : String(d.before ?? '—'); const after = Array.isArray(d.after) ? d.after.join(', ') : String(d.after ?? '—'); return '<div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)"><div style="padding:8px 12px;border-right:1px solid var(--border);background:rgba(220,38,38,.06)"><div style="color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:700;margin-bottom:3px">' + Utils.escapeHtml(d.label || d.field) + '</div><div style="color:#fca5a5;font-size:12px;word-break:break-word">' + Utils.escapeHtml(String(before).slice(0, 200)) + '</div></div><div style="padding:8px 12px;background:rgba(34,197,94,.06)"><div style="color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:700;margin-bottom:3px">' + Utils.escapeHtml(d.label || d.field) + '</div><div style="color:#86efac;font-size:12px;word-break:break-word">' + Utils.escapeHtml(String(after).slice(0, 200)) + '</div></div></div>'; }).join('') + '</div><div style="margin-top:8px;color:var(--muted);font-size:12px;text-align:center">Всего различий: <b style="color:#fff;font-size:14px">' + diffs.length + '</b></div>';
  }

  function render(){
    const cur = versions.find(v => v._versionNumber === sel);
    const ap = versions.filter(v => v._statusSnapshot === 'approved');
    const la = ap[ap.length-1];
    m.innerHTML = '<div class="modal" style="max-width:1100px"><div class="modal-head"><div><div class="modal-title">🔖 Версии</div><div style="color:var(--muted);font-size:12px">' + Utils.escapeHtml(norm.operationCode) + '</div></div><button class="modal-close" type="button" data-close>×</button></div><div class="modal-body"><div class="form-sec-title">📅 Все версии (' + versions.length + ')</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;-webkit-overflow-scrolling:touch">' + versions.map(v => { const vc = Plugins.call('versions','getVersionColor', v._statusSnapshot); const vl = Plugins.call('versions','buildVersionLabel', v); const isA = v._statusSnapshot === 'approved'; return '<div class="tile clickable" data-select-version="' + v._versionNumber + '" style="min-width:200px;' + (v._versionNumber===sel?'border-color:var(--accent);background:rgba(37,99,235,.1)':'') + (isA?';box-shadow:0 0 0 2px rgba(74,222,128,.3)':'') + '"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:#fff;font-weight:700;font-size:15px">v' + v._versionNumber + '</span>' + (isA?'<span class="chip" style="font-size:9px;background:rgba(74,222,128,.2);color:#4ade80">✅ утв.</span>':'') + '</div>' + (v._statusSnapshot?'<div style="font-size:10px;color:' + vc + ';background:' + vc + '15;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:4px">' + vl + '</div>':'') + '<div style="color:var(--muted);font-size:11px">' + new Date(v._versionAt).toLocaleString('ru-RU') + '</div><div style="color:var(--muted);font-size:11px">👤 ' + Utils.escapeHtml(v._versionBy) + '</div></div>'; }).join('') + '</div><div class="form-sec-title" style="margin-top:20px">🔄 Сравнение двух версий</div><div class="grid2" style="margin-bottom:12px"><select class="sel" id="verA" style="padding:9px"><option value="">— Версия A —</option>' + versions.map(v => '<option value="' + v._versionNumber + '" ' + (state.verCompareA === v._versionNumber ? 'selected' : '') + '>v' + v._versionNumber + ' (' + new Date(v._versionAt).toLocaleDateString('ru-RU') + ')</option>').join('') + '</select><select class="sel" id="verB" style="padding:9px"><option value="">— Версия B —</option>' + versions.map(v => '<option value="' + v._versionNumber + '" ' + (state.verCompareB === v._versionNumber ? 'selected' : '') + '>v' + v._versionNumber + ' (' + new Date(v._versionAt).toLocaleDateString('ru-RU') + ')</option>').join('') + '</select></div><div id="verCompareResult" style="margin-bottom:16px"></div><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-ghost" type="button" data-close>Закрыть</button><button class="btn btn-ghost" type="button" id="verCSV">📄 CSV</button>' + (la && cur._versionNumber !== la._versionNumber ? '<button class="btn btn-success" type="button" data-revert-to-approved>✅ К утверждённой v' + la._versionNumber + '</button>' : '') + (sel !== versions.length ? '<button class="btn btn-orange" type="button" data-revert="' + sel + '">↩ Откатить к v' + sel + '</button>' : '') + '</div></div></div>';
    m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
    m.querySelectorAll('[data-select-version]').forEach(el => el.onclick = () => { sel = parseInt(el.dataset.selectVersion); render(); });
    m.querySelectorAll('[data-revert]').forEach(b => b.onclick = () => { const tv = parseInt(b.dataset.revert); if(!confirm('Откатить к v' + tv + '?')) return; const r = Plugins.call('versions','revertToVersion', normId, tv); if(r.ok){ showToast('Создана v' + r.version._versionNumber, 'ok'); m.remove(); renderChat(); } });
    const apb = m.querySelector('[data-revert-to-approved]');
    if(apb) apb.onclick = () => { if(!confirm('Вернуться к утверждённой v' + la._versionNumber + '?')) return; const r = Plugins.call('versions','revertToVersion', normId, la._versionNumber); if(r.ok){ showToast('Создана v' + r.version._versionNumber, 'ok'); m.remove(); renderChat(); } };
    const selA = m.querySelector('#verA'); const selB = m.querySelector('#verB');
    if(selA) selA.onchange = (e) => { state.verCompareA = e.target.value ? parseInt(e.target.value) : null; renderCompare(); };
    if(selB) selB.onchange = (e) => { state.verCompareB = e.target.value ? parseInt(e.target.value) : null; renderCompare(); };
    m.querySelector('#verCSV').onclick = () => { const csv = Plugins.call('versions','exportVersionsCSV', normId); Utils.download('versions_' + norm.operationCode + '.csv', '\uFEFF' + csv, 'text/csv'); };
    renderCompare();
  }
  document.body.appendChild(m); render();
}

      <div class="tile">
        <div class="tile-h">Экспорт всех данных</div>

        <div class="tile-h">Импорт данных</div>

    };
    document.getElementById('clearCards').onclick = ()=>{
      if(!confirm('Удалить все техкарты?')) return;
      state.cards=[]; saveCards(); renderChat();
    };
  });
}

/* ═══ USERS ═══ */
function tabUsers(){
  if(!Auth.isAdmin()){ appendMsg('<div class="warn-banner err">✕ Только для администратора</div>'); return; }
  const rawUsers = Auth.listUsers();
  
  // Получаем список пользователей с хешами для отображения статуса
  // getRawUsers() возвращает полные записи (включая password) — используем только для админ-экрана
  const rawFull = Auth.getRawUsers();
  const usersWithHashes = Auth.listUsers().map(u => {
    const fullUser = rawFull.find(x => x.login === u.login) || {};
    return { ...u, isHashed: Auth.isHashed(fullUser.password) };
  });

  appendMsg('<div class="bubble-title">👥 Пользователи</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">' + 
    usersWithHashes.map(u => {
      return '<div class="tile"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div>' +
        '<span style="font-family:monospace;color:#fdba74;font-size:14px">' + Utils.escapeHtml(u.login) + '</span>' +
        (u.login === Auth.currentSession().login ? '<span class="badge-mini" style="margin-left:6px">вы</span>' : '') +
        (u.isHashed ? '<span class="badge-mini" style="margin-left:6px;color:#86efac;border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.1)">🔒 хеш</span>' : '<span class="badge-mini" style="margin-left:6px;color:#fca5a5;border:1px solid rgba(220,38,38,.4);background:rgba(220,38,38,.1)">⚠ plaintext</span>') +
        '<div style="color:#fff;font-weight:600;margin-top:4px">' + Utils.escapeHtml(u.name) + '</div>' +
        '<span class="badge-role ' + u.role + '" style="margin-top:6px;display:inline-block">' + ROLE_NAMES[u.role] + '</span></div>' +
        '<div style="display:flex;gap:6px">' + 
        (u.login !== Auth.currentSession().login ? 
          '<button class="btn btn-ghost btn-xs" type="button" data-reset-pwd="' + Utils.escapeHtml(u.login) + '">🔑 Сбросить пароль</button>' +
          '<button class="btn btn-danger btn-xs" type="button" data-del-user="' + Utils.escapeHtml(u.login) + '">🗑</button>' : '') +
        '</div></div></div>';
    }).join('') + 
    '</div><div class="form-sec-title">➕ Добавить</div><form id="addUserForm"><div class="form-row"><div class="form-group"><label class="form-lbl">Логин *</label><input class="form-inp" name="login" required pattern="[a-zA-Z0-9_]{3,20}"></div><div class="form-group"><label class="form-lbl">ФИО *</label><input class="form-inp" name="name" required></div></div><div class="form-row"><div class="form-group"><label class="form-lbl">Пароль *</label><input class="form-inp" type="password" name="password" minlength="6" required></div><div class="form-group"><label class="form-lbl">Роль *</label><select class="form-sel" name="role"><option value="user">Пользователь</option><option value="engineer">Инженер</option><option value="admin">Администратор</option></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="submit" class="btn btn-orange">➕ Добавить</button></div></form>'
  ).then(() => {
    // Обработчик удаления
    document.querySelectorAll('[data-del-user]').forEach(b => b.onclick = () => { 
      if(confirm('Удалить "' + b.dataset.delUser + '"?')){ 
        const r = Auth.removeUser(b.dataset.delUser); 
        if(r.ok) renderChat(); else alert(r.msg); 
      } 
    });
    
    // Обработчик сброса пароля (НОВАЯ ФУНКЦИЯ)
    document.querySelectorAll('[data-reset-pwd]').forEach(b => b.onclick = () => {
      showAdminResetPasswordModal(b.dataset.resetPwd);
    });
    
    // Обработчик добавления
    document.getElementById('addUserForm').onsubmit = async e => { 
      e.preventDefault(); 
      const fd = new FormData(e.target); 
      const r = await Auth.addUser({login:fd.get('login').trim(), password:fd.get('password'), name:fd.get('name'), role:fd.get('role')}); 
      if(r.ok){ alert('Добавлен'); renderChat(); } else alert(r.msg); 
    };
  });
}
function showAdminResetPasswordModal(login){
  const m = document.createElement('div');
  m.className = 'modal-ov';
  m.innerHTML = '<div class="modal" style="max-width:480px">' +
    '<div class="modal-head"><div class="modal-title">🔑 Сброс пароля</div><button class="modal-close" type="button" data-close>×</button></div>' +
    '<div class="modal-body">' +
    '<div class="warn-banner info">ℹ️ Вы меняете пароль для пользователя <b>' + Utils.escapeHtml(login) + '</b>.</div>' +
    '<div class="form-group"><label class="form-lbl">Новый пароль (мин. 6 символов) *</label><input class="form-inp" type="password" id="admin-reset-pwd" minlength="6" required></div>' +
    '<div class="form-group"><label class="form-lbl">Повторите пароль *</label><input class="form-inp" type="password" id="admin-reset-pwd2" minlength="6" required></div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" type="button" data-close>Отмена</button><button class="btn btn-orange" type="button" id="admin-reset-save">💾 Сменить пароль</button></div>' +
    '</div></div>';
  document.body.appendChild(m);
  
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  
  document.getElementById('admin-reset-save').onclick = async () => {
    const p1 = document.getElementById('admin-reset-pwd').value;
    const p2 = document.getElementById('admin-reset-pwd2').value;
    if(p1 !== p2){ alert('Пароли не совпадают'); return; }
    if(p1.length < 6){ alert('Минимум 6 символов'); return; }
    
    const r = await Auth.adminResetPassword(login, p1);
    if(r.ok){
      alert('Пароль для "' + login + '" успешно изменён.');
      m.remove();
      renderChat();
    } else {
      alert('Ошибка: ' + r.msg);
    }
  };
}

function showCreateCardModal(){
  const total = state.calc.reduce((s,i) => s+i.norm.normValue*i.qty, 0);
  const days = Math.ceil(total/8);
  const num = 'ТК-' + new Date().getFullYear() + '-' + String(state.cards.length+1).padStart(3,'0');
  const m = document.createElement('div'); m.className = 'modal-ov';
  m.innerHTML = '<div class="modal"><div class="modal-head"><div class="modal-title">📄 Создание техкарты</div><button class="modal-close" type="button" data-close>×</button></div><div class="modal-body"><div class="form-group"><label class="form-lbl">Номер *</label><input class="form-inp" id="cc-num" value="' + num + '"></div><div class="form-row"><div class="form-group"><label class="form-lbl">Тип ремонта *</label><select class="form-sel" id="cc-rep"><option>ТР</option><option selected>СР</option><option>КР</option></select></div><div class="form-group"><label class="form-lbl">Оборудование *</label><input class="form-inp" id="cc-eq" value="ДСП-100 №1"></div></div><div class="form-group"><label class="form-lbl">ТМ</label><input class="form-inp tm" id="cc-tm" maxlength="28"><div class="form-hint" id="cc-tm-hint">Необязательно</div></div><div class="grid3" style="margin-top:12px"><div class="tile" style="text-align:center"><div class="tile-v">' + state.calc.length + '</div><div class="tile-d">Операций</div></div><div class="tile" style="text-align:center"><div class="tile-v orange">' + total + '</div><div class="tile-d">Чел-час</div></div><div class="tile" style="text-align:center"><div class="tile-v purple">' + days + '</div><div class="tile-d">Дней</div></div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" type="button" data-close>Отмена</button><button class="btn btn-orange" type="button" id="cc-save">💾 Создать</button></div></div></div>';
  document.body.appendChild(m);
  const tmInp = m.querySelector('#cc-tm');
  tmInp.addEventListener('input', () => { tmInp.value = TM.format(tmInp.value); });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  document.getElementById('cc-save').onclick = () => {
    const tmValue = (tmInp.value||'').trim();
    if(tmValue){ const r = TM.validate(tmValue); if(!r.ok){ alert('ТМ: '+r.msg); return; } }
    const card = { id: Utils.uid('card'), cardNumber: document.getElementById('cc-num').value, equipmentName: document.getElementById('cc-eq').value, tm: tmValue, repairType: document.getElementById('cc-rep').value, operations: state.calc.map(i => ({normativeId:i.norm.id, quantity:i.qty})), totalHours: total, calendarDays: days, createdAt: new Date().toISOString(), status: 'draft', author: Auth.currentSession()?.login || 'unknown' };
    state.cards.push(card); saveCards(); state.calc = []; m.remove(); state.tab = 'cards'; renderNav(); renderChat(); showToast('Техкарта создана', 'ok');
  };
}
function showViewCard(card){
  if(!card) return;
  const m = document.createElement('div'); m.className = 'modal-ov';
  const rows = card.operations.map((op, i) => { const n = allNorms().find(x => x.id === op.normativeId); if(!n) return ''; return '<tr style="border-top:1px solid rgba(55,65,81,.6)"><td style="padding:8px 12px;color:var(--dim)">' + (i+1) + '</td><td style="padding:8px 12px;font-family:monospace;font-size:11px;color:#fdba74">' + Utils.escapeHtml(n.operationCode) + '</td><td style="padding:8px 12px;color:#fff">' + Utils.escapeHtml(n.operationName) + '</td><td style="padding:8px 12px;text-align:center">' + n.normValue + '</td><td style="padding:8px 12px;text-align:center">' + op.quantity + '</td><td style="padding:8px 12px;text-align:center;font-weight:700">' + (n.normValue*op.quantity) + '</td></tr>'; }).join('');
  m.innerHTML = '<div class="modal" style="max-width:900px"><div class="modal-head"><div><div class="modal-title">' + Utils.escapeHtml(card.cardNumber) + '</div><div style="color:var(--muted);font-size:12px">' + Utils.escapeHtml(card.equipmentName) + '</div></div><button class="modal-close" type="button" data-close>×</button></div><div class="modal-body"><div style="background:#111827;border-radius:10px;overflow-x:auto;border:1px solid var(--border)"><table style="width:100%;font-size:13px;border-collapse:collapse;min-width:600px"><thead><tr style="background:#374151;color:var(--muted);font-size:11px;text-transform:uppercase"><th style="padding:8px 12px;text-align:left">№</th><th style="padding:8px 12px;text-align:left">Код</th><th style="padding:8px 12px;text-align:left">Операция</th><th style="padding:8px 12px;text-align:center">Норма</th><th style="padding:8px 12px;text-align:center">Кол-во</th><th style="padding:8px 12px;text-align:center">Итого</th></tr></thead><tbody>' + rows + '</tbody></table></div><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-success" type="button" id="cardPrint">🖨 Печать</button><button class="btn btn-danger" type="button" id="cardPDF">📕 PDF</button><button class="btn btn-ghost" type="button" id="cardTxt">📥 TXT</button></div></div></div>';
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  m.querySelector('#cardPrint').onclick = () => printCard(card);
  m.querySelector('#cardPDF').onclick = () => { Plugins.call('pdf-export','exportTechCardPDF', card).then(r => { if(r && r.ok) showToast('PDF: ' + r.filename, 'ok'); else showToast('Ошибка: ' + (r?.msg||''), 'err'); }); };
  m.querySelector('#cardTxt').onclick = () => Utils.download('ТК_' + card.cardNumber + '.txt', generateCardText(card), 'text/plain');
}
function generateCardText(card){
  const ops = card.operations.map((op, i) => { const n = allNorms().find(x => x.id === op.normativeId); return n ? (i+1) + '. ' + n.operationCode + ' | ' + n.operationName + ' | ' + n.normValue + ' × ' + op.quantity + ' = ' + (n.normValue*op.quantity) + ' чел-час' : ''; }).filter(Boolean).join('\n');
  return 'ТЕХНОЛОГИЧЕСКАЯ КАРТА\n' + card.cardNumber + '\nОборудование: ' + card.equipmentName + '\nТип: ' + REPAIR_NAMES[card.repairType] + '\nДата: ' + new Date(card.createdAt).toLocaleDateString('ru-RU') + '\n\n' + ops + '\n\nИТОГО: ' + card.totalHours + ' чел-час';
}
function printCard(card){
  if(!card) return;
  const rows = card.operations.map((op, i) => { const n = allNorms().find(x => x.id === op.normativeId); if(!n) return ''; return '<tr><td style="border:1px solid #333;padding:5px;text-align:center">' + (i+1) + '</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:10px">' + n.operationCode + '</td><td style="border:1px solid #333;padding:5px">' + n.operationName + '</td><td style="border:1px solid #333;padding:5px;text-align:center">' + n.normValue + '</td><td style="border:1px solid #333;padding:5px;text-align:center">' + op.quantity + '</td><td style="border:1px solid #333;padding:5px;text-align:center;font-weight:bold">' + (n.normValue*op.quantity) + '</td></tr>'; }).filter(Boolean).join('');
  const w = window.open('', '_blank'); if(!w){ alert('Разрешите всплывающие окна'); return; }
  w.document.write('<html><head><meta charset="UTF-8"><title>ТК</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial;font-size:10pt}table{width:100%;border-collapse:collapse}th{background:#e5e7eb;border:1px solid #333;padding:5px}</style></head><body><h1 style="text-align:center">ТЕХНОЛОГИЧЕСКАЯ КАРТА</h1><h2 style="text-align:center">' + card.cardNumber + '</h2><div><b>Оборудование:</b> ' + card.equipmentName + '</div><div><b>Тип:</b> ' + REPAIR_NAMES[card.repairType] + '</div><table><thead><tr><th>№</th><th>Код</th><th>Операция</th><th>Норма</th><th>Кол-во</th><th>Итого</th></tr></thead><tbody>' + rows + '</tbody></table><p><b>ИТОГО: ' + card.totalHours + ' чел-час</b></p><button onclick="window.print()">🖨 Печать</button></body></html>');
  w.document.close();
}
function exportCsv(){
  if(!state.calc.length){ alert('Калькулятор пуст'); return; }
  const h = ['Код','Операция','ТМ','Норматив','Кол-во','Итого'];
  const rows = state.calc.map(i => [i.norm.operationCode, i.norm.operationName, i.norm.tm||'', i.norm.normValue, i.qty, i.norm.normValue*i.qty]);
  const csv = [h, ...rows].map(r => r.join(';')).join('\n');
  Utils.download('расчёт_' + new Date().toISOString().slice(0,10) + '.csv', '\uFEFF' + csv, 'text/csv');
}

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нормативы ЭСП — Lite (серверная версия)</title>
<style>
:root{--bg:#111827;--panel:#1f2937;--panel2:#374151;--border:#374151;--border-soft:rgba(55,65,81,.6);--border-hi:#4b5563;--text:#e5e7eb;--muted:#9ca3af;--dim:#6b7280;--accent:#2563eb;--accent-h:#3b82f6;--green:#16a34a;--red:#dc2626;--yellow:#eab308;--purple:#a855f7;--cyan:#06b6d4;--orange:#f97316}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;background:#111827;color:var(--text)}
.login-screen{position:fixed;inset:0;z-index:2000;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,.18),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(168,85,247,.14),transparent 55%),#111827;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.login-box{background:#1f2937;border:1px solid var(--border-hi);border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 32px rgba(37,99,235,.45)}
.login-box h2{text-align:center;color:#fff;font-size:22px;font-weight:800;margin-bottom:6px}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;letter-spacing:.5px;text-transform:uppercase}
.login-box .sub b{color:#93c5fd}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.login-field input{width:100%;background:#111827;border:1px solid #4b5563;border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;font-family:inherit;transition:border-color .15s}
.login-field input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:14px;font-weight:700;font-family:inherit;margin-top:8px;transition:all .2s}
.login-btn:hover{background:linear-gradient(135deg,#1d4ed8,#4338ca);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:wait}
.login-error{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:none}
.login-error.show{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-hint{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);text-align:center;line-height:1.7}
.login-accounts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.login-account{background:#111827;border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;transition:all .15s}
.login-account:hover{border-color:var(--accent-h);background:#1a2233}
.login-account .role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.login-account .login-name{font-family:monospace;font-size:11.5px;color:#93c5fd;margin-top:2px}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh;overflow:hidden}
.app.hidden{display:none}
.sidebar{background:#1f2937;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1e3a8a,#312e81,#581c87)}
.brand-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.brand-text h1{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.brand-text p{font-size:11px;color:#93c5fd;margin-top:2px}
.nav-scroll{flex:1;overflow-y:auto;padding:12px 10px}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:#4b5563;border-radius:3px}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;padding:6px 10px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#cbd5e1;font-size:13.5px;font-weight:500;transition:all .18s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:#334155;color:#fff}
.nav-item.active{background:#2563eb;color:#fff}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge-n{margin-left:auto;background:rgba(37,99,235,.25);color:#93c5fd;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.nav-item.active .badge-n{background:rgba(255,255,255,.2);color:#fff}
.nav-item.admin-only{opacity:.5;pointer-events:none}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dim);text-align:center}
.main{display:flex;flex-direction:column;overflow:hidden;position:relative;background:#111827}
.topbar{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#1f2937;z-index:10;flex-wrap:wrap;gap:10px}
.topbar-title{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:15px;flex:1;min-width:200px}
.topbar-title .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-badge{display:flex;align-items:center;gap:8px;background:#111827;border:1px solid var(--border);border-radius:10px;padding:6px 12px 6px 8px;font-size:12px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.user-badge .uname{color:#fff;font-weight:600}
.user-badge .urole{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;background:#374151;color:#cbd5e1;font-family:inherit;white-space:nowrap}
.btn:hover{background:#4b5563;color:#fff}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:hover{background:#374151;color:#fff}
.btn-danger{background:rgba(220,38,38,.15);color:#fca5a5;border-color:rgba(220,38,38,.35)}
.btn-xs{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-ico{padding:8px;width:36px;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chat{flex:1;overflow-y:auto;padding:24px 24px 40px;display:flex;flex-direction:column;gap:14px}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.msg{max-width:100%;display:flex;animation:slideIn .35s}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bubble{background:#1f2937;border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.6;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.25);width:100%;max-width:1000px}
.bubble-title{color:#fff;font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bubble-sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.bubble ul{list-style:none;margin:6px 0}
.bubble li{padding:3px 0;font-size:13.5px;display:flex;gap:8px}
.bubble li::before{content:'▸';color:#60a5fa;flex-shrink:0}
.bubble code{font-family:'JetBrains Mono',monospace;background:#111827;padding:2px 6px;border-radius:4px;font-size:12.5px;color:#93c5fd}
.bubble .hl{color:#93c5fd;font-weight:600}
.tm-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(168,85,247,.15);color:#d8b4fe;padding:3px 8px;border-radius:6px;border:1px solid rgba(168,85,247,.3);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:600;border:1px solid}
.chip-blue{color:#93c5fd;border-color:rgba(59,130,246,.4);background:rgba(37,99,235,.15)}
.chip-green{color:#86efac;border-color:rgba(34,197,94,.4);background:rgba(22,163,74,.15)}
.chip-yellow{color:#fde047;border-color:rgba(234,179,8,.4);background:rgba(202,138,4,.15)}
.chip-red{color:#fca5a5;border-color:rgba(239,68,68,.4);background:rgba(220,38,38,.15)}
.chip-purple{color:#d8b4fe;border-color:rgba(168,85,247,.4);background:rgba(147,51,234,.15)}
.chip-cyan{color:#67e8f9;border-color:rgba(6,182,212,.4);background:rgba(8,145,178,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.tile{background:#111827;border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:all .2s}
.tile-h{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.tile-v{font-size:22px;font-weight:800;color:#fff}
.tile-v.blue{color:#60a5fa}.tile-v.green{color:#4ade80}.tile-v.purple{color:#c084fc}
.tile-v.yellow{color:#facc15}.tile-v.red{color:#f87171}.tile-v.orange{color:#fb923c}
.tile-d{font-size:11.5px;color:var(--muted);margin-top:4px}
.norms-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#111827;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.search-inp{flex:1;min-width:200px;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:9px 14px;color:#fff;font-size:13.5px;font-family:inherit}
.search-inp:focus{outline:none;border-color:#3b82f6}
.sel{background:#111827;border:1px solid #4b5563;border-radius:8px;padding:8px 12px;color:#cbd5e1;font-size:12.5px;font-family:inherit;cursor:pointer}
.norm-row{background:#111827;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:all .2s}
.norm-row:hover{border-color:var(--border-hi);background:#1a2233}
.norm-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.norm-row-info{flex:1;min-width:200px}
.norm-row-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#93c5fd;font-weight:600}
.norm-row-name{color:#fff;font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.35}
.norm-row-eq{color:var(--muted);font-size:11.5px;margin-top:3px}
.norm-row-tm{margin-top:5px}
.norm-row-stats{display:flex;gap:16px;align-items:center;flex-shrink:0}
.norm-stat{text-align:center}
.norm-stat-v{font-size:18px;font-weight:800;color:#fff;line-height:1}
.norm-stat-l{font-size:10px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.norm-row-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.calc-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.calc-wrap{grid-template-columns:1fr}}
.calc-list{background:#111827;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.calc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:13px}
.calc-item:last-child{border-bottom:none}
.calc-item-name{flex:1;min-width:0;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-item-meta{font-size:11px;color:var(--dim)}
.qty-btn{width:24px;height:24px;border-radius:6px;background:#374151;color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:#2563eb}
.qty-val{color:#fff;font-weight:700;width:28px;text-align:center;font-size:13.5px}
.calc-del{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;font-size:14px}
.calc-del:hover{color:#f87171}
.calc-summary{background:#111827;padding:14px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.calc-sidebar{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;position:sticky;top:10px;height:fit-content}
.stat-bar{margin-bottom:10px}
.stat-bar-h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.stat-bar-name{color:var(--muted)}
.stat-bar-v{color:#fff;font-weight:700}
.stat-bar-track{height:8px;background:#374151;border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.tech-card{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.tech-card-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.tech-card-num{font-family:'JetBrains Mono',monospace;color:#93c5fd;font-size:12.5px;font-weight:700}
.tech-card-title{color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.tech-card-meta{color:var(--muted);font-size:12px;margin-top:4px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s}
.modal{background:#1f2937;border:1px solid var(--border-hi);border-radius:16px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1f2937;z-index:5}
.modal-title{color:#fff;font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px}
.modal-body{padding:20px 22px}
.form-group{margin-bottom:14px}
.form-lbl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-inp,.form-sel,.form-ta{width:100%;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:9px 12px;color:#fff;font-size:13.5px;font-family:inherit}
.form-inp:focus,.form-sel:focus,.form-ta:focus{outline:none;border-color:#3b82f6}
.form-inp.err{border-color:#dc2626}
.form-inp.ok{border-color:#16a34a}
.form-inp.tm{font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.form-ta{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-sec-title{color:#fff;font-weight:700;font-size:13px;margin:18px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.form-hint{font-size:11px;color:var(--dim);margin-top:4px}
.form-hint.err{color:#fca5a5}
.form-hint.ok{color:#86efac}
.warn-banner{background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.4);color:#fde047;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.warn-banner.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}
.warn-banner.err{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.4);color:#fca5a5}
.warn-banner.info{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.4);color:#93c5fd}
.empty{text-align:center;padding:40px 20px;color:var(--dim);background:#111827;border:1px dashed #4b5563;border-radius:12px}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.6}
.badge-mini{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700;background:#374151;color:var(--muted)}
.badge-role{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.badge-role.admin{background:rgba(220,38,38,.2);color:#fca5a5;border:1px solid rgba(220,38,38,.4)}
.badge-role.engineer{background:rgba(37,99,235,.2);color:#93c5fd;border:1px solid rgba(37,99,235,.4)}
.badge-role.user{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4)}
.mob-toggle{display:none}
@media(max-width:900px){
  .app{grid-template-columns:0 1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:200;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .mob-toggle{display:inline-flex}
  .chat{padding:16px}
}
.full-toast{position:fixed;bottom:24px;right:24px;z-index:5000;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:14px 20px;border-radius:12px;box-shadow:0 12px 32px rgba(37,99,235,.5);font-size:13px;max-width:340px;display:flex;gap:12px;align-items:flex-start}
.full-toast .toast-icon{font-size:22px;flex-shrink:0}
.full-toast .toast-title{font-weight:700;margin-bottom:4px}
.full-toast .toast-desc{opacity:.9;font-size:12px;line-height:1.4}
.full-toast .toast-close{position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm" autocomplete="off">
    <div class="login-logo">⚙️</div>
    <h2>Нормативы ЭСП</h2>
    <div class="sub">Lite · Серверная версия</div>
    <div class="login-error" id="loginError">Неверный логин или пароль</div>
    <div class="login-field">
      <label>Логин</label>
      <input name="login" id="loginInput" placeholder="Введите логин" required autocomplete="username">
    </div>
    <div class="login-field">
      <label>Пароль</label>
      <input name="password" id="passwordInput" type="password" placeholder="Введите пароль" required autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn" id="loginBtn">🔐 Войти в систему</button>
    <div class="login-hint">
      Демо-доступы (нажмите для подстановки):
      <div class="login-accounts">
        <div class="login-account" data-login="admin" data-pwd="admin123"><div class="role">Админ</div><div class="login-name">admin</div></div>
        <div class="login-account" data-login="engineer" data-pwd="eng123"><div class="role">Инженер</div><div class="login-name">engineer</div></div>
        <div class="login-account" data-login="user" data-pwd="user123"><div class="role">Польз.</div><div class="login-name">user</div></div>
      </div>
    </div>
  </form>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">⚙️</div>
      <div class="brand-text">
        <h1>Нормативы ЭСП</h1>
        <p>Lite · Трудозатраты · Ремонт</p>
      </div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="sidebar-footer">ЭСП © 2024–2026 · v3.5 Lite</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="dot"></span>
        <span id="topbarTitle">Нормативы</span>
        <span class="badge-role user" id="versionBadge">Lite</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ico mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <button class="btn btn-ghost" onclick="switchToFull()" title="Перейти в расширенную версию">↪ Full</button>
        <div class="user-badge" id="userBadge"></div>
        <button class="btn btn-ghost" onclick="doLogout()">⎋ Выход</button>
      </div>
    </div>
    <div class="chat" id="chat"></div>
  </main>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   СЛОВАРИ
   ═══════════════════════════════════════════════════════════ */
const SECTION_NAMES = {'UPSMiF':'УПСМиФ','DSP':'ДСП','UPK':'УПК (печь-ковш)','UVD':'УВД (вакууматор)','ONLZ':'ОНЛЗ','USH':'УСХиОЗ','UOR':'УОРСиШК','BLD':'Здания производственные','ABK':'АБК','LIFT':'Подъёмные сооружения'};
const CATEGORY_NAMES = {mechanical:'Механическое',energy:'Энергетическое',hydraulic:'Гидравлическое',electric:'Электрическое',lifting:'Подъёмные сооружения',refractory:'Огнеупорное',building:'Строительные конструкции'};
const SOURCE_NAMES = {federal:'Федеральные нормативы',gost:'ГОСТы',safety:'Правила безопасности (ФНП)',actual:'Фактические данные',industry:'Отраслевые рекомендации'};
const REPAIR_NAMES = {'ТР':'Текущий ремонт','СР':'Средний ремонт','КР':'Капитальный ремонт'};
const ROLE_NAMES = {admin:'Администратор',engineer:'Инженер',user:'Пользователь'};

/* ═══════════════════════════════════════════════════════════
   API-КЛИЕНТ
   ═══════════════════════════════════════════════════════════ */
const API = {
  token: localStorage.getItem('esp_token') || '',
  user: null,

  async call(method, path, body){
    const headers = { 'Content-Type': 'application/json' };
    if(this.token) headers['Authorization'] = 'Bearer ' + this.token;
    let r;
    try {
      r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch(e) {
      return { ok:false, msg:'Сервер недоступен. Проверьте подключение.' };
    }
    if(r.status === 401){
      this.token = '';
      localStorage.removeItem('esp_token');
      if(location.pathname.indexOf('esp-lite') >= 0 || location.pathname.indexOf('esp-full') >= 0){
        showLogin();
      }
      return { ok:false, msg:'Сессия истекла' };
    }
    try { return await r.json(); } catch(e) { return { ok:false, msg:'Ошибка разбора ответа' }; }
  },

  get(p){ return this.call('GET', p); },
  post(p, b){ return this.call('POST', p, b); },
  put(p, b){ return this.call('PUT', p, b); },
  del(p){ return this.call('DELETE', p); },

  async login(login, password){
    const r = await this.post('/api/login', { login, password });
    if(r.ok){
      this.token = r.token;
      this.user = r.user;
      localStorage.setItem('esp_token', r.token);
    }
    return r;
  },

  async me(){
    const r = await this.get('/api/me');
    if(r.ok) this.user = r.user;
    return r;
  },

  logout(){
    this.token = '';
    this.user = null;
    localStorage.removeItem('esp_token');
  }
};

/* ═══════════════════════════════════════════════════════════
   ГЛОБАЛЬНОЕ СОСТОЯНИЕ
   ═══════════════════════════════════════════════════════════ */
const state = {
  tab: 'normatives',
  norms: [],
  equipment: [],
  cards: [],
  workflowStates: {},
  search: '',
  fSection: '', fCat: '', fRep: '', fSrc: '',
  calc: [],
  calcSearch: ''
};

function allNorms(){ return state.norms; }
function getFiltered(){
  return state.norms.filter(n => {
    const s = state.search.toLowerCase().trim();
    const mS = !s || (n.operationName||'').toLowerCase().includes(s) || (n.equipmentType||'').toLowerCase().includes(s)
      || (n.operationCode||'').toLowerCase().includes(s) || (n.tm && n.tm.toLowerCase().includes(s));
    return mS
      && (!state.fSection || n.section === state.fSection)
      && (!state.fCat || n.equipmentCategory === state.fCat)
      && (!state.fRep || n.repairType === state.fRep)
      && (!state.fSrc || n.sourceType === state.fSrc);
  });
}

/* ═══════════════════════════════════════════════════════════
   ЗАГРУЗКА ДАННЫХ
   ═══════════════════════════════════════════════════════════ */
async function loadAll(){
  const [normsR, equipR, cardsR, statesR] = await Promise.all([
    API.get('/api/norms'),
    API.get('/api/equipment'),
    API.get('/api/cards'),
    API.get('/api/workflow/states')
  ]);
  if(normsR.ok) state.norms = normsR.norms || [];
  if(equipR.ok) state.equipment = equipR.equipment || [];
  if(cardsR.ok) state.cards = cardsR.cards || [];
  if(statesR.ok) state.workflowStates = statesR.states || {};
}

async function refreshNorms(){
  const r = await API.get('/api/norms');
  if(r.ok) state.norms = r.norms || [];
}

/* ═══════════════════════════════════════════════════════════
   TM
   ═══════════════════════════════════════════════════════════ */
const TM_PREFIX = '1201';
function validateTM(tm){
  if(!tm) return {ok:true, empty:true, msg:'Необязательно'};
  const p = tm.split('-');
  if(p.length !== 7) return {ok:false, msg:'Ожидается 7 групп'};
  if(p[0] !== TM_PREFIX) return {ok:false, msg:`Префикс ${TM_PREFIX}`};
  for(let i=1;i<7;i++){ if(!/^\d{3}$/.test(p[i])) return {ok:false, msg:`Группа ${i}: 3 цифры`}; }
  return {ok:true, msg:'OK'};
}
function autoFormatTM(input){
  let v = input.value.replace(/[^\d]/g,'');
  if(v.length > 22) v = v.slice(0,22);
  if(!v){ input.value=''; return; }
  if(v.length <= 4){ input.value = v; return; }
  let out = v.slice(0,4);
  for(let i=4; i<v.length; i+=3) out += '-' + v.slice(i, i+3);
  input.value = out;
}

/* ═══════════════════════════════════════════════════════════
   UI-ХЕЛПЕРЫ
   ═══════════════════════════════════════════════════════════ */
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showToast(text, type='info', duration=3000){
  const t = document.createElement('div');
  t.className = 'full-toast';
  const icons = {ok:'✅', info:'ℹ️', warn:'⚠️', err:'❌'};
  t.innerHTML = `<button class="toast-close" onclick="this.parentElement.remove()">×</button>
    <div class="toast-icon">${icons[type]||'ℹ️'}</div>
    <div><div class="toast-title">${type==='ok'?'Готово':type==='err'?'Ошибка':'Информация'}</div>
    <div class="toast-desc">${escapeHtml(text)}</div></div>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), duration);
}

/* ═══════════════════════════════════════════════════════════
   LOGIN / LOGOUT
   ═══════════════════════════════════════════════════════════ */
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.add('hidden');
  const form = document.getElementById('loginForm');
  if(form) form.reset();
  const err = document.getElementById('loginError');
  if(err) err.classList.remove('show');
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  renderUserBadge(); renderNav(); renderChat();
}

function renderUserBadge(){
  const s = API.user;
  if(!s) return;
  const initial = (s.name || s.login).charAt(0).toUpperCase();
  document.getElementById('userBadge').innerHTML = `
    <div class="user-avatar">${initial}</div>
    <div>
      <div class="uname">${escapeHtml(s.name||s.login)}</div>
      <div class="urole">${ROLE_NAMES[s.role]||s.role}</div>
    </div>`;
}

async function doLogout(){
  if(!confirm('Выйти из системы?')) return;
  API.logout();
  showLogin();
}

async function switchToFull(){
  if(!confirm('↪ Переход в расширенную версию Full?\n\nВсе данные общие — вы увидите то же самое.')) return;
  window.location.href = 'esp-full.html';
}

/* ═══════════════════════════════════════════════════════════
   НАВИГАЦИЯ
   ═══════════════════════════════════════════════════════════ */
function buildNav(){
  const role = API.user?.role || 'user';
  return [
    {group:'Работа',items:[
      {id:'normatives',label:'Нормативы',ico:'🔍',badge:state.norms.length+''},
      {id:'calculator',label:'Калькулятор',ico:'🧮'},
      {id:'cards',label:'Тех. карты',ico:'📄',badge:state.cards.length+''},
      {id:'statistics',label:'Статистика',ico:'📊'},
      {id:'add',label:'Добавить норматив',ico:'➕'},
      {id:'addEquip',label:'Добавить оборудование',ico:'🔧'}
    ]},
    {group:'Справочник',items:[
      {id:'equipment',label:'Оборудование',ico:'⚙️'},
      {id:'about',label:'О версии',ico:'ℹ️'}
    ]},
    {group:'Настройки',items:[
      {id:'settings',label:'Пользователь',ico:'👤'},
      {id:'users',label:'Пользователи',ico:'👥',adminOnly:true}
    ]}
  ];
}
function renderNav(){
  const nav = document.getElementById('navScroll');
  const groups = buildNav();
  const role = API.user?.role || 'user';
  nav.innerHTML = groups.map(g => `
    <div class="nav-section">
      <div class="nav-section-title">${g.group}</div>
      ${g.items.map(it => {
        const disabled = it.adminOnly && role !== 'admin';
        return `<div class="nav-item${state.tab===it.id?' active':''}${disabled?' admin-only':''}" ${disabled?'':`data-nav="${it.id}"`}>
          <span class="ico">${it.ico}</span><span>${it.label}</span>${it.badge?`<span class="badge-n">${it.badge}</span>`:''}
        </div>`;
      }).join('')}
    </div>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => {
      state.tab = el.dataset.nav;
      document.getElementById('sidebar').classList.remove('open');
      renderNav(); renderChat();
    };
  });
}

function appendMsg(html, delay=0){
  return new Promise(res => {
    setTimeout(() => {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.innerHTML = `<div class="bubble">${html}</div>`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      res();
    }, delay);
  });
}

function renderChat(){
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  const titles = {
    normatives:'Нормативы', calculator:'Калькулятор', cards:'Тех. карты',
    statistics:'Статистика', add:'Добавить норматив', addEquip:'Добавить оборудование',
    equipment:'Оборудование', about:'О версии', settings:'Пользователь', users:'Пользователи'
  };
  document.getElementById('topbarTitle').textContent = titles[state.tab] || 'Нормативы';
  const fn = TABS[state.tab];
  if(fn) fn();
}

/* ═══════════════════════════════════════════════════════════
   ВКЛАДКА: НОРМАТИВЫ
   ═══════════════════════════════════════════════════════════ */
function tabNormatives(){
  const filtered = getFiltered();
  appendMsg(`
    <div class="bubble-title">🔍 База нормативов</div>
    <div class="bubble-sub" id="normsSub">Найдено: <span class="hl">${filtered.length}</span> из ${state.norms.length}</div>
    <div class="norms-toolbar">
      <input class="search-inp" id="srch" placeholder="🔎 Поиск..." value="${escapeHtml(state.search)}">
      <select class="sel" id="f-sec"><option value="">Все участки</option>${Object.entries(SECTION_NAMES).map(([k,v])=>`<option value="${k}" ${state.fSection===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-cat"><option value="">Все категории</option>${Object.entries(CATEGORY_NAMES).map(([k,v])=>`<option value="${k}" ${state.fCat===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-rep"><option value="">Все типы</option>${Object.entries(REPAIR_NAMES).map(([k,v])=>`<option value="${k}" ${state.fRep===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="sel" id="f-src"><option value="">Все источники</option>${Object.entries(SOURCE_NAMES).map(([k,v])=>`<option value="${k}" ${state.fSrc===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    <div style="max-height:60vh;overflow-y:auto;padding-right:4px" id="normsListBox">${renderNormsList(filtered)}</div>
  `).then(() => attachNormEvents());
}

function renderNormsList(list){
  if(!list.length) return '<div class="empty"><div class="empty-ico">🔍</div>Ничего не найдено</div>';
  return list.map(n => {
    const inCalc = state.calc.some(c => c.norm.id === n.id);
    const cc = n.confidenceLevel>=0.9?'#4ade80':n.confidenceLevel>=0.7?'#60a5fa':n.confidenceLevel>=0.5?'#facc15':'#f87171';
    return `<div class="norm-row">
      <div class="norm-row-head">
        <div class="norm-row-info">
          <div class="norm-row-code">${escapeHtml(n.operationCode)}</div>
          <div class="norm-row-name">${escapeHtml(n.operationName)}</div>
          <div class="norm-row-eq">${SECTION_NAMES[n.section]||''} • ${escapeHtml(n.equipmentType||'')} • ${escapeHtml(n.equipmentUnit||'')}</div>
          ${n.tm?`<div class="norm-row-tm"><span class="tm-code">ТМ: ${n.tm}</span></div>`:''}
        </div>
        <div class="norm-row-stats">
          <div class="norm-stat"><div class="norm-stat-v">${n.normValue}</div><div class="norm-stat-l">чел-час</div></div>
          <div class="norm-stat"><div class="norm-stat-v" style="color:${cc};font-size:15px">${(n.confidenceLevel*100).toFixed(0)}%</div><div class="norm-stat-l">достов.</div></div>
        </div>
        <div class="norm-row-actions">
          <button class="btn ${inCalc?'btn-success':'btn-primary'} btn-xs" data-norm-add="${n.id}">${inCalc?'✓ В расчёте':'+ В расчёт'}</button>
        </div>
      </div>
      <div class="chips" style="margin-top:8px">
        <span class="chip chip-purple">${REPAIR_NAMES[n.repairType]||n.repairType}</span>
        <span class="chip chip-cyan">Сложность ${n.complexity}/5</span>
        <span class="chip chip-blue">${n.teamSize} чел. • ${escapeHtml(n.qualification||'—')}</span>
        <span class="chip chip-green">${escapeHtml(n.sourceCode||'')}</span>
      </div>
    </div>`;
  }).join('');
}

function attachNormEvents(){
  const s = document.getElementById('srch'); if(s) s.oninput = e => { state.search = e.target.value; refreshNormsList(); };
  ['f-sec|fSection','f-cat|fCat','f-rep|fRep','f-src|fSrc'].forEach(p => {
    const [id,key] = p.split('|'); const el = document.getElementById(id);
    if(el) el.onchange = e => { state[key] = e.target.value; refreshNormsList(); };
  });
  bindNormAddButtons();
}
function bindNormAddButtons(){
  document.querySelectorAll('#normsListBox [data-norm-add]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.normAdd;
      const norm = state.norms.find(n => n.id === id);
      if(!norm) return;
      if(!state.calc.find(c => c.norm.id === id)) state.calc.push({ norm, qty:1 });
      b.className = 'btn btn-success btn-xs'; b.textContent = '✓ В расчёте';
    };
  });
}
function refreshNormsList(){
  const box = document.getElementById('normsListBox');
  if(box){ box.innerHTML = renderNormsList(getFiltered()); bindNormAddButtons(); }
  const sub = document.getElementById('normsSub');
  if(sub) sub.innerHTML = `Найдено: <span class="hl">${getFiltered().length}</span> из ${state.norms.length}`;
}

/* ═══════════════════════════════════════════════════════════
   ВКЛАДКА: КАЛЬКУЛЯТОР
   ═══════════════════════════════════════════════════════════ */
function tabCalculator(){
  appendMsg(`
    <div class="bubble-title">🧮 Калькулятор трудозатрат</div>
    <div class="bubble-sub">В расчёте: <span class="hl">${state.calc.length}</span> операций</div>
    <div class="calc-wrap">
      <div>
        <input class="search-inp" id="calc-srch" placeholder="🔎 Поиск..." value="${escapeHtml(state.calcSearch)}" style="margin-bottom:10px">
        <div id="calcOpsBox" style="max-height:52vh;overflow-y:auto;padding-right:4px">${renderCalcOps()}</div>
      </div>
      <div class="calc-sidebar" id="calcSidebar">${renderCalcSidebar()}</div>
    </div>
  `).then(() => attachCalcEvents());
}
function renderCalcOps(){
  const list = state.norms.filter(n => {
    const s = state.calcSearch.toLowerCase().trim();
    return !s || (n.operationName||'').toLowerCase().includes(s) || (n.operationCode||'').toLowerCase().includes(s)
      || (n.equipmentType||'').toLowerCase().includes(s) || (n.tm && n.tm.toLowerCase().includes(s));
  }).slice(0, 80);
  if(!list.length) return '<div class="empty"><div class="empty-ico">🔎</div>Ничего не найдено</div>';
  return list.map(n => {
    const inCalc = state.calc.some(c => c.norm.id === n.id);
    return `<div class="norm-row"><div class="norm-row-head">
      <div class="norm-row-info">
        <div class="norm-row-code">${escapeHtml(n.operationCode)}</div>
        <div class="norm-row-name">${escapeHtml(n.operationName)}</div>
        <div class="norm-row-eq">${escapeHtml(n.equipmentType||'')} • ${n.normValue} чел-час</div>
      </div>
      <button class="btn ${inCalc?'btn-success':'btn-primary'} btn-xs" data-calc-add="${n.id}">${inCalc?'✓':'+ В расчёт'}</button>
    </div></div>`;
  }).join('');
}
function renderCalcSidebar(){
  const total = state.calc.reduce((s,i) => s + i.norm.normValue*i.qty, 0);
  const days = Math.ceil(total/8);
  const avgTeam = state.calc.length ? (state.calc.reduce((s,i) => s+i.norm.teamSize, 0)/state.calc.length).toFixed(1) : '0';
  if(!state.calc.length){
    return `<div style="color:#fff;font-weight:700;font-size:14px;margin-bottom:12px">🧮 Расчёт</div>
      <div class="empty" style="padding:20px 10px"><div class="empty-ico">🧮</div>Добавьте операции</div>`;
  }
  return `
    <div style="color:#fff;font-weight:700;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <span>🧮 Расчёт</span>
      <button class="btn btn-danger btn-xs" id="calcClear">Очистить</button>
    </div>
    <div class="calc-list">
      ${state.calc.map(it => `
        <div class="calc-item">
          <div style="flex:1;min-width:0">
            <div class="calc-item-name">${escapeHtml(it.norm.operationName)}</div>
            <div class="calc-item-meta">${it.norm.normValue} × ${it.qty} = <b style="color:#93c5fd">${it.norm.normValue*it.qty}</b></div>
          </div>
          <button class="qty-btn" data-qm="${it.norm.id}">−</button>
          <span class="qty-val">${it.qty}</span>
          <button class="qty-btn" data-qp="${it.norm.id}">+</button>
          <button class="calc-del" data-rm="${it.norm.id}">✕</button>
        </div>
      `).join('')}
      <div class="calc-summary">
        <div><div class="norm-stat-v">${total}</div><div class="norm-stat-l">чел-час</div></div>
        <div><div class="norm-stat-v" style="color:#60a5fa">${days}</div><div class="norm-stat-l">дней</div></div>
        <div><div class="norm-stat-v" style="color:#c084fc">${avgTeam}</div><div class="norm-stat-l">бригада</div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <button class="btn btn-success" id="calcCreate">📄 Создать техкарту</button>
      <button class="btn btn-ghost" id="calcExport">📥 Экспорт CSV</button>
    </div>`;
}
function attachCalcEvents(){
  const s = document.getElementById('calc-srch'); if(s) s.oninput = e => { state.calcSearch = e.target.value; refreshCalcOps(); };
  bindCalcEvents();
}
function refreshCalcOps(){ const b = document.getElementById('calcOpsBox'); if(b){ b.innerHTML = renderCalcOps(); bindCalcOpsEvents(); } }
function refreshCalcSidebar(){ const b = document.getElementById('calcSidebar'); if(b){ b.innerHTML = renderCalcSidebar(); bindCalcEvents(); } }
function bindCalcOpsEvents(){
  document.querySelectorAll('#calcOpsBox [data-calc-add]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.calcAdd;
      const norm = state.norms.find(n => n.id === id);
      if(!norm) return;
      if(!state.calc.find(c => c.norm.id === id)) state.calc.push({ norm, qty:1 });
      refreshCalcOps(); refreshCalcSidebar();
    };
  });
}
function bindCalcEvents(){
  const clr = document.getElementById('calcClear'); if(clr) clr.onclick = () => { state.calc = []; refreshCalcOps(); refreshCalcSidebar(); };
  const crt = document.getElementById('calcCreate'); if(crt) crt.onclick = showCreateCardModal;
  const exp = document.getElementById('calcExport'); if(exp) exp.onclick = exportCsv;
  document.querySelectorAll('#calcSidebar [data-qm]').forEach(b => b.onclick = () => {
    const it = state.calc.find(c => c.norm.id === b.dataset.qm); if(it && it.qty > 1) it.qty--;
    refreshCalcOps(); refreshCalcSidebar();
  });
  document.querySelectorAll('#calcSidebar [data-qp]').forEach(b => b.onclick = () => {
    const it = state.calc.find(c => c.norm.id === b.dataset.qp); if(it) it.qty++;
    refreshCalcOps(); refreshCalcSidebar();
  });

/* ═══════════════════════════════════════════════════════════
   ВКЛАДКА: СТАТИСТИКА
   ═══════════════════════════════════════════════════════════ */
function tabStatistics(){
  const norms = state.norms;
  const avgConf = norms.length ? (norms.reduce((s,n) => s+n.confidenceLevel, 0)/norms.length*100).toFixed(0) : '0';
  const byS = {}; Object.keys(SECTION_NAMES).forEach(k => byS[k] = norms.filter(n => n.section === k).length);
  const maxS = Math.max(1, ...Object.values(byS));
  const byC = {}; Object.keys(CATEGORY_NAMES).forEach(k => byC[k] = norms.filter(n => n.equipmentCategory === k).length);
  const maxC = Math.max(1, ...Object.values(byC));
  const cc = {mechanical:'#3b82f6',energy:'#eab308',hydraulic:'#06b6d4',electric:'#22c55e',lifting:'#a855f7',refractory:'#f97316',building:'#f43f5e'};
  const withTM = norms.filter(n => n.tm).length;
  appendMsg(`
    <div class="bubble-title">📊 Статистика</div>
    <div class="grid4">
      <div class="tile"><div class="tile-h">Всего</div><div class="tile-v blue">${norms.length}</div></div>
      <div class="tile"><div class="tile-h">Ср. достоверность</div><div class="tile-v green">${avgConf}%</div></div>
      <div class="tile"><div class="tile-h">С ТМ-кодом</div><div class="tile-v orange">${withTM}</div><div class="tile-d">из ${norms.length}</div></div>
      <div class="tile"><div class="tile-h">Техкарт</div><div class="tile-v purple">${state.cards.length}</div></div>
    </div>
    <div class="form-sec-title" style="margin-top:20px">📊 По участкам ЭСП</div>
    ${Object.entries(SECTION_NAMES).map(([k,name]) => {
      const c = byS[k];
      return `<div class="stat-bar"><div class="stat-bar-h"><span class="stat-bar-name">${name}</span><span class="stat-bar-v">${c}</span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(c/maxS)*100}%;background:linear-gradient(90deg,#3b82f6,#8b5cf6)"></div></div></div>`;
    }).join('')}
    <div class="form-sec-title" style="margin-top:20px">⚙️ По категориям</div>
    ${Object.entries(CATEGORY_NAMES).map(([k,name]) => {
      const c = byC[k];
      return `<div class="stat-bar"><div class="stat-bar-h"><span class="stat-bar-name">${name}</span><span class="stat-bar-v">${c}</span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(c/maxC)*100}%;background:${cc[k]}"></div></div></div>`;
    }).join('')}
    <div class="form-sec-title" style="margin-top:20px">🔧 По типу ремонта</div>
    <div class="grid3">
      ${Object.entries(REPAIR_NAMES).map(([k,v]) => {
        const c = norms.filter(n => n.repairType === k).length;
        return `<div class="tile" style="text-align:center"><div class="tile-v">${c}</div><div class="tile-d">${v}</div></div>`;
      }).join('')}
    </div>
  `);
}

            <div style="flex:1;min-width:180px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-family:monospace;color:#93c5fd">${escapeHtml(u.login)}</span>
                ${u.login===API.user.login?'<span class="badge-mini">это вы</span>':''}
                <span class="badge-mini" title="Хеш bcrypt">🔒 хеш</span>
              </div>
              <div style="color:#fff;font-weight:600">${escapeHtml(u.name)}</div>
              <div style="margin-top:6px"><span class="badge-role ${u.role}">${ROLE_NAMES[u.role]||u.role}</span></div>
            </div>
            <div style="display:flex;gap:6px">
              ${u.login!==API.user.login?`<button class="btn btn-ghost btn-xs" data-reset-pwd="${escapeHtml(u.login)}">🔑 Сбросить пароль</button>`:''}
              ${u.login!==API.user.login?`<button class="btn btn-danger btn-xs" data-del-user="${escapeHtml(u.login)}">🗑 Удалить</button>`:''}
            </div>
          </div>
        </div>`).join('')}
    </div>
    <div class="form-sec-title">➕ Добавить пользователя</div>
    <form id="addUserForm">
      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Логин *</label><input class="form-inp" name="login" required pattern="[a-zA-Z0-9_]{3,20}"></div>
        <div class="form-group"><label class="form-lbl">ФИО *</label><input class="form-inp" name="name" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Пароль * (мин. 6)</label><input class="form-inp" type="password" name="password" minlength="6" required></div>
        <div class="form-group"><label class="form-lbl">Роль *</label><select class="form-sel" name="role"><option value="user">Пользователь</option><option value="engineer">Инженер</option><option value="admin">Администратор</option></select></div>
      </div>
      <div id="userMsg"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="submit" class="btn btn-primary">➕ Добавить</button></div>
    </form>
  `).then(() => {
    document.querySelectorAll('[data-del-user]').forEach(b => b.onclick = async () => {
      if(!confirm(`Удалить "${b.dataset.delUser}"?`)) return;
      const r = await API.del('/api/users/' + encodeURIComponent(b.dataset.delUser));
      if(r.ok) renderChat(); else alert(r.msg);
    });
    document.querySelectorAll('[data-reset-pwd]').forEach(b => b.onclick = async () => {
      const login = b.dataset.resetPwd;
      const np = prompt(`Новый пароль для "${login}" (мин. 6 символов):`);
      if(np === null) return;
      if(np.length < 6){ alert('Минимум 6 символов'); return; }
      const r = await API.post('/api/users/' + encodeURIComponent(login) + '/reset-password', { password: np });
      if(r.ok){ alert(`Пароль для "${login}" изменён`); }
      else alert(r.msg);
    });
    document.getElementById('addUserForm').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await API.post('/api/users', {
        login: (fd.get('login')||'').trim(),
        password: fd.get('password'),
        name: fd.get('name'),
        role: fd.get('role')
      });
      if(r.ok){ alert('Добавлен'); renderChat(); }
      else document.getElementById('userMsg').innerHTML = `<div class="warn-banner err">✕ ${escapeHtml(r.msg)}</div>`;
    };
  });
}

function showCreateCardModal(){
  const total = state.calc.reduce((s,i) => s + i.norm.normValue*i.qty, 0);
  const days = Math.ceil(total/8);
  const num = `ТК-${new Date().getFullYear()}-${String(state.cards.length+1).padStart(3,'0')}`;
  const m = document.createElement('div');
  m.className = 'modal-ov';
  m.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">📄 Создание техкарты</div>
        <button class="modal-close" data-close>×</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label class="form-lbl">Номер карты *</label><input class="form-inp" id="cc-num" value="${num}"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-lbl">Тип ремонта *</label><select class="form-sel" id="cc-rep"><option>ТР</option><option selected>СР</option><option>КР</option></select></div>
          <div class="form-group"><label class="form-lbl">Оборудование *</label><input class="form-inp" id="cc-eq" value="ДСП-100 №1"></div>
        </div>
        <div class="form-group">
          <label class="form-lbl">ТМ</label>
          <input class="form-inp tm" id="cc-tm" maxlength="28">
          <div class="form-hint" id="cc-tm-hint">Необязательно</div>
        </div>
        <div class="grid3" style="margin-top:12px">
          <div class="tile" style="text-align:center"><div class="tile-v">${state.calc.length}</div><div class="tile-d">Операций</div></div>
          <div class="tile" style="text-align:center"><div class="tile-v orange">${total}</div><div class="tile-d">Чел-час</div></div>
          <div class="tile" style="text-align:center"><div class="tile-v purple">${days}</div><div class="tile-d">Дней</div></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
          <button class="btn btn-ghost" data-close>Отмена</button>
          <button class="btn btn-primary" id="cc-save">💾 Создать</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(m);
  const tmInp = m.querySelector('#cc-tm');
  const tmHint = m.querySelector('#cc-tm-hint');
  tmInp.addEventListener('input', () => {
    autoFormatTM(tmInp);
    const v = tmInp.value.trim();
    if(!v){ tmHint.className='form-hint'; tmHint.textContent='Необязательно'; return; }
    const r = validateTM(v);
    if(r.ok){ tmHint.className='form-hint ok'; tmHint.textContent='✓ '+r.msg; }
    else { tmHint.className='form-hint err'; tmHint.textContent='✕ '+r.msg; }
  });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  document.getElementById('cc-save').onclick = async () => {
    const tmValue = (tmInp.value||'').trim();
    if(tmValue){ const r = validateTM(tmValue); if(!r.ok){ alert('ТМ: '+r.msg); return; } }
    const body = {
      cardNumber: document.getElementById('cc-num').value,
      equipmentName: document.getElementById('cc-eq').value,
      tm: tmValue,
      repairType: document.getElementById('cc-rep').value,
      operations: state.calc.map(i => ({ normativeId: i.norm.id, quantity: i.qty })),
      totalHours: total,
      calendarDays: days
    };
    const r = await API.post('/api/cards', body);
    if(!r.ok){ alert(r.msg || 'Ошибка создания карты'); return; }
    showToast('Техкарта создана', 'ok');
    state.calc = [];
    await loadAll();
    m.remove();
    state.tab = 'cards'; renderNav(); renderChat();
  };
}

            <thead><tr style="background:#374151;color:var(--muted);font-size:11px;text-transform:uppercase">
              <th style="padding:8px 12px;text-align:left">№</th>
              <th style="padding:8px 12px;text-align:left">Код</th>
              <th style="padding:8px 12px;text-align:left">Операция</th>
              <th style="padding:8px 12px;text-align:center">Норма</th>
              <th style="padding:8px 12px;text-align:center">Кол-во</th>

        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-success" id="cardPrint">🖨 Печать</button>
          <button class="btn btn-ghost" id="cardTxt">📥 TXT</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.remove());
  m.querySelector('#cardPrint').onclick = () => printCard(card);
  m.querySelector('#cardTxt').onclick = () => downloadFile(`ТК_${card.cardNumber}.txt`, generateCardText(card), 'text/plain');

function generateCardText(card){
  const ops = card.operations.map((op, i) => {
    const n = state.norms.find(x => x.id === op.normativeId);
    return n ? `${i+1}. ${n.operationCode} | ${n.operationName} | ${n.normValue} × ${op.quantity} = ${n.normValue*op.quantity} чел-час${n.tm?' | ТМ: '+n.tm:''}` : '';
  }).filter(Boolean).join('\n');
  return `ТЕХНОЛОГИЧЕСКАЯ КАРТА\n${card.cardNumber}\nОборудование: ${card.equipmentName}\n${card.tm?'ТМ: '+card.tm+'\n':''}Тип ремонта: ${REPAIR_NAMES[card.repairType]}\nДата: ${new Date(card.createdAt).toLocaleDateString('ru-RU')}\nАвтор: ${card.author||'—'}\n\n${ops}\n\nИТОГО: ${card.totalHours} чел-час\nДней: ${card.calendarDays}`;
}

function printCard(card){
  if(!card) return;
  const rows = card.operations.map((op, i) => {
    const n = state.norms.find(x => x.id === op.normativeId);
    if(!n) return '';
    return `<tr><td style="border:1px solid #333;padding:5px;text-align:center">${i+1}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:10px">${n.operationCode}</td><td style="border:1px solid #333;padding:5px">${n.operationName}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:9px">${n.tm||'—'}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.normValue}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.unit}</td><td style="border:1px solid #333;padding:5px;text-align:center">${op.quantity}</td><td style="border:1px solid #333;padding:5px;text-align:center;font-weight:bold">${n.normValue*op.quantity}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.teamSize}</td><td style="border:1px solid #333;padding:5px;font-size:10px">${n.qualification||'—'}</td></tr>`;
  }).filter(Boolean).join('');
  const w = window.open('', '_blank');
  if(!w) return;
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ТК ${card.cardNumber}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;font-size:10pt}.header{text-align:center;margin-bottom:16px;border-bottom:2px solid #000;padding-bottom:8px}.header h1{font-size:15pt;margin:0}.header h2{font-size:12pt;margin:4px 0 0;font-weight:normal}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:9.5pt}th{background:#e5e7eb;border:1px solid #333;padding:5px;font-weight:bold;text-align:center}.total-row{background:#f3f4f6;font-weight:bold}.signatures{display:flex;justify-content:space-between;margin-top:36px}.signature{width:45%}.signature-line{border-bottom:1px solid #000;margin-top:28px;padding-top:4px;font-size:8pt}.no-print{text-align:center;margin-bottom:16px}.no-print button{padding:8px 16px;font-size:13px;cursor:pointer;border:none;border-radius:5px;margin:0 4px}@media print{.no-print{display:none}}</style></head><body><div class="no-print"><button onclick="window.print()" style="background:#16a34a;color:white">🖨 Печать</button><button onclick="window.close()" style="background:#6b7280;color:white">Закрыть</button></div><div class="header"><h1>ТЕХНОЛОГИЧЕСКАЯ КАРТА</h1><h2>${card.cardNumber}</h2></div><div style="margin:12px 0"><div><strong>Оборудование:</strong> ${card.equipmentName}</div>${card.tm?`<div><strong>ТМ:</strong> ${card.tm}</div>`:''}<div><strong>Тип:</strong> ${REPAIR_NAMES[card.repairType]}</div><div><strong>Дата:</strong> ${new Date(card.createdAt).toLocaleDateString('ru-RU')}</div><div><strong>Автор:</strong> ${card.author||'—'}</div></div><table><thead><tr><th>№</th><th>Код</th><th>Операция</th><th>ТМ</th><th>Норма</th><th>Ед.</th><th>Кол-во</th><th>Итого</th><th>Бриг.</th><th>Разряд</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="total-row"><td colspan="7" style="text-align:right;border:1px solid #333;padding:7px">ИТОГО:</td><td style="text-align:center;border:1px solid #333;padding:7px;font-size:11pt">${card.totalHours} чел-час</td><td colspan="2" style="text-align:center;border:1px solid #333;padding:7px">Дней: ${card.calendarDays}</td></tr></tfoot></table><div class="signatures"><div class="signature"><div class="signature-line">Разработал (инженер)</div></div><div class="signature"><div class="signature-line">Согласовал (начальник участка)</div></div></div><div class="signatures" style="margin-top:16px"><div class="signature"><div class="signature-line">Утвердил (начальник цеха)</div></div><div class="signature"><div class="signature-line">Дата утверждения</div></div></div></body></html>`);
  w.document.close();
}

function downloadFile(name, content, type){
  const b = new Blob([content], {type: type+';charset=utf-8;'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name; a.click();
  URL.revokeObjectURL(u);
}

function exportCsv(){
  if(!state.calc.length){ alert('Калькулятор пуст'); return; }
  const h = ['Код','Операция','ТМ','Участок','Оборудование','Норматив','Кол-во','Итого','Бригада','Источник'];
  const rows = state.calc.map(i => [i.norm.operationCode, i.norm.operationName, i.norm.tm||'', SECTION_NAMES[i.norm.section]||'', `${i.norm.equipmentType} (${i.norm.equipmentUnit})`, i.norm.normValue, i.qty, i.norm.normValue*i.qty, i.norm.teamSize, i.norm.sourceCode]);
  const csv = [h, ...rows].map(r => r.join(';')).join('\n');
  downloadFile(`расчёт_${new Date().toISOString().slice(0,10)}.csv`, '\uFEFF'+csv, 'text/csv');
}

  const pwd = document.getElementById('passwordInput').value;

    await loadAll();
    showApp();

    setTimeout(() => err.classList.remove('show'), 3000);
  }
};

});
